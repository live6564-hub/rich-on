<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>세포랩 플로우 영상 자막</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 투명 배경 자막 레이어 1080×1920. 플로우 영상(장면1 0~5.5초, 장면2 5.5~11.1초) 위에 얹는다 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
body{font-family:"Noto Sans KR",sans-serif;color:#221C15;word-break:keep-all}
.serif{font-family:"Noto Serif KR",serif}
.abs{position:absolute}
.layer{position:absolute;inset:0}

#A .top{left:72px;right:72px;top:110px;display:flex;justify-content:space-between;font-size:30px;letter-spacing:.08em;color:#8C8274;border-bottom:1px solid rgba(34,28,21,.25);padding-bottom:22px}
#A h1{left:72px;top:250px;font-size:104px;font-weight:700;line-height:1.3;letter-spacing:-.03em}
#A h1 span{display:block}
#A .lead{left:72px;top:560px;font-size:38px;line-height:1.6;color:#5E564C}

#B .kick{left:72px;top:170px;font-size:34px;color:#A8681A;letter-spacing:.06em;display:flex;align-items:center;gap:20px;font-weight:500}
#B .kick::after{content:"";width:80px;height:2px;background:#A8681A;opacity:.6}
#B .num{left:56px;top:240px;font-size:330px;font-weight:900;color:#A8681A;letter-spacing:-.05em;line-height:1}
#B .num sup{font-size:120px;vertical-align:top;margin-left:8px;position:relative;top:30px}
#B h2{left:72px;top:620px;font-size:84px;font-weight:700;line-height:1.32;letter-spacing:-.03em}
#B .chips{left:72px;top:900px;display:flex;gap:16px}
#B .chips span{border:2px solid #221C15;border-radius:999px;padding:12px 28px;font-size:32px;font-weight:500;background:rgba(246,241,232,.6)}
#B .src{left:72px;top:1010px;font-size:26px;color:#8C8274}
</style>
</head>
<body>
<div class="layer" id="A">
  <div class="abs top"><span>FIRST ESSENCE</span><span>155 ml</span></div>
  <h1 class="abs serif"><span id="a1">세수하고 30초,</span><span id="a2">당기기 전에 한 겹</span></h1>
  <p class="abs lead" id="a3">토너 다음, 크림 전에 바르는 퍼스트 에센스</p>
</div>
<div class="layer" id="B">
  <div class="abs kick" id="b0">이름 속 90%의 뜻</div>
  <div class="abs num serif" id="b1"><span id="bn">0.0</span><sup>%</sup></div>
  <h2 class="abs serif" id="bh">수분이 아니라<br>원료 함량이에요</h2>
  <div class="abs chips" id="bc"><span>전성분 5가지</span><span>인공 색소·향료 없음</span></div>
  <div class="abs src" id="bs">출처 · 세포랩 공식몰 · 상품정보제공고시</div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const span=(t,a,b)=>ease((t-a)/(b-a));
const show=(el,p,dy=40)=>{el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px)`};
window.render=function(t){
  $('A').style.opacity=1-span(t,5.2,5.6);
  $('B').style.opacity=1-span(t,10.8,11.2);
  show($('a1'),span(t,0.3,1.1)); show($('a2'),span(t,1.2,2.0)); show($('a3'),span(t,2.2,2.9),20);
  show($('b0'),span(t,5.8,6.3),20); show($('b1'),span(t,5.9,6.4),0);
  $('bn').textContent=(92.8*span(t,6.2,8.0)).toFixed(1);
  show($('bh'),span(t,8.1,8.9)); show($('bc'),span(t,9.0,9.6)); show($('bs'),span(t,9.4,10.0),10);
};
window.render(0);
</script>
</body>
</html>
