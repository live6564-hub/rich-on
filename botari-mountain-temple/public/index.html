// 자동 이름 짓기 (예: 맑은 솔방울)
function randomName() {
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const L = {
    ko: [['맑은', '고요한', '포근한', '푸른', '작은', '따뜻한', '잔잔한', '소박한', '느긋한', '반짝이는'], ['솔방울', '이슬', '산바람', '연꽃', '구름', '종소리', '달빛', '다람쥐', '오솔길', '물결'], 'ab'],
    en: [['Calm', 'Quiet', 'Gentle', 'Little', 'Warm', 'Clear', 'Soft', 'Kind'], ['Pine', 'Dew', 'Breeze', 'Lotus', 'Cloud', 'Moon', 'Bell', 'Stream'], 'ab'],
    zh: [['安靜的', '清澈的', '溫暖的', '小小的', '悠閒的', '柔和的'], ['松果', '露珠', '山風', '蓮花', '白雲', '月光', '鐘聲'], 'ab0'],
    vi: [['nhỏ', 'hiền', 'êm', 'ấm', 'trong'], ['Sương', 'Gió', 'Sen', 'Mây', 'Trăng', 'Suối', 'Chuông'], 'ba'],
    th: [['น้อย', 'สงบ', 'อุ่น', 'ใส'], ['ดอกบัว', 'เมฆ', 'จันทร์', 'สายลม', 'ระฆัง', 'ธารน้ำ'], 'ba']
  }[LANG] || null;
  const [A, B, order] = L;
  const a = pick(A), b = pick(B);
  return order === 'ab' ? `${a} ${b}` : order === 'ab0' ? `${a}${b}` : `${b} ${a}`;
}

const Net = (() => {
  const pill = document.getElementById('placePill');
  const joinModal = document.getElementById('joinModal');
  const fullModal = document.getElementById('fullModal');
  const nickInput = document.getElementById('nickInput');
  const online = location.protocol === 'http:' || location.protocol === 'https:';
  const others = new Map();        // id → { m, tag, snaps: [{t,x,y,z,ry,act}] }
  const DELAY = 0.25;              // 0.25초 늦게 그려서 받은 위치 사이를 부드럽게 잇는다
  let ws = null, myId = null, nick = '', retry = 0, retryTimer = null, pingTimer = null;
  let isFull = false, lastSend = 0, last = null, myTag = null;
  let roomIdx = 1, hopping = false, seatWait = null, switching = false;
  const HALLS = (C.room.halls || ['1번 방']).slice(0, 9), MAX_ROOMS = HALLS.length;
  const roomKey = (i) => C.room.name + (i > 1 ? '-' + i : '');
  const roomList = document.getElementById('roomList'), roomMsg = document.getElementById('roomMsg');
  let pickIdx = 1, counts = [];
  // 방마다 지금 몇 명인지 서버에 물어서 단추로 보여 줌
  function loadRooms(msg = '') {
    roomMsg.textContent = msg || T('roomLoading');
    roomList.innerHTML = HALLS.map((n, i) => `<button type="button" data-i="${i + 1}">${hallName(i, n)}<small>…</small></button>`).join('');
    fetch('/rooms', { cache: 'no-store' }).then((r) => r.json()).then((d) => {
      counts = d.rooms || [];
      const firstFree = counts.findIndex((c) => c < C.room.maxPeople);
      if (counts[pickIdx - 1] >= C.room.maxPeople || !counts.length) pickIdx = firstFree >= 0 ? firstFree + 1 : 1;
      renderRooms(); roomMsg.textContent = msg;
    }).catch(() => { counts = []; renderRooms(); roomMsg.textContent = msg; });
  }
  function renderRooms() {
    roomList.innerHTML = HALLS.map((n, i) => {
      const c = counts[i], full = c >= C.room.maxPeople;
      const label = c === undefined ? '' : full ? T('roomFull') : T('people', c);
      return `<button type="button" data-i="${i + 1}" class="${pickIdx === i + 1 ? 'sel' : ''}" ${full ? 'disabled' : ''}>${hallName(i, n)}<small>${label}</small></button>`;
    }).join('');
    const allFull = counts.length && counts.every((c) => c >= C.room.maxPeople);
    document.getElementById('joinBtn').disabled = !!allFull;
    if (allFull) roomMsg.textContent = T('allFull');
  }
  roomList.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-i]'); if (!b || b.disabled) return;
    pickIdx = +b.dataset.i; renderRooms();
  });

  const now = () => performance.now() / 1000;
  const setPill = (extra) => { pillNet = extra || ''; renderPill(); };

  function addOther(info) {
    if (info.id === myId || others.has(info.id)) return;
    const m = makeMonk(C.character);
    const tag = makeNameTag(info.name || T('guest'));
    m.root.add(tag);
    m.root.position.set(info.x ?? C.world.start.x, info.y ?? 0, info.z ?? C.world.start.z);
    m.root.rotation.y = info.ry ?? Math.PI;
    scene.add(m.root);
    others.set(info.id, { m, tag, act: info.act || 0, tap: info.tap, bell: info.bell, bead: info.bead, seat: info.seat || null, snaps: [{ t: now(), ...info }] });
    m.gassho = !!(info.fx & 1); m.holding = !!(info.fx & 2);
  }
  function removeOther(id) {
    const o = others.get(id); if (!o) return;
    scene.remove(o.m.root);
    o.m.root.traverse((n) => { n.geometry?.dispose?.(); n.material?.map?.dispose?.(); });
    others.delete(id);
  }
  function clearOthers() { [...others.keys()].forEach(removeOther); }
  function countText() { setPill(`${hallName(roomIdx - 1, HALLS[roomIdx - 1] || '')} · 👥 ${others.size + 1}`); }

  function connect() {
    clearTimeout(retryTimer);
    const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host +
      '/ws?room=' + encodeURIComponent(roomKey(roomIdx)) + '&name=' + encodeURIComponent(nick);
    try { ws = new WebSocket(url); } catch (e) { scheduleRetry(); return; }
    setPill(T('connecting'));
    ws.onopen = () => {
      retry = 0;
      clearInterval(pingTimer);
      pingTimer = setInterval(() => { if (ws && ws.readyState === 1) ws.send('ping'); }, 25000);
      last = null;   // 연결되면 내 위치를 한 번 보낸다
    };
    ws.onmessage = (ev) => {
      if (ev.data === 'pong') return;
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.t === 'welcome') {
        myId = msg.id; clearOthers();
        msg.peers.forEach(addOther); countText();
      } else if (msg.t === 'join') { addOther(msg); countText(); }
      else if (msg.t === 'leave') { removeOther(msg.id); countText(); }
      else if (msg.t === 'pos') {
        const o = others.get(msg.id);
        if (!o) { addOther(msg); countText(); return; }
        o.snaps.push({ t: now(), x: msg.x, y: msg.y, z: msg.z, ry: msg.ry, act: msg.act });
        o.m.gassho = !!(msg.fx & 1); o.m.holding = !!(msg.fx & 2);
        // 목탁 두드리기 (가까이 있을 때만 소리)
        if (o.tap !== undefined && msg.tap !== o.tap) {
          startTap(o.m);
          if (o.m.root.position.distanceTo(monk.root.position) < 10) Sound.tok();
        }
        o.tap = msg.tap;
        // 다른 사람이 종을 침 (절 어디서나 들림)
        if (o.bell !== undefined && msg.bell !== o.bell) { bellSwing = 1; Sound.bell(); }
        o.bell = msg.bell;
        if (o.bead !== undefined && msg.bead !== o.bead) { o.m.malaShow = 2.5; o.m.mala.rotation.z += (Math.PI * 2) / 14; }
        o.bead = msg.bead;
        o.seat = msg.seat || null;
        if (o.snaps.length > 30) o.snaps.shift();
      } else if (msg.t === 'seat') {
        if (seatWait) { seatWait(!!msg.ok); seatWait = null; }
      } else if (msg.t === 'full') {
        // 고른 방이 그사이 꽉 참 → 방 고르기 창을 다시 띄움
        isFull = true; setPill(T('roomFullPill'));
        openPicker(T('justFull'));
      }
    };
    ws.onclose = () => {
      clearInterval(pingTimer);
      ws = null; clearOthers();
      if (seatWait) { seatWait(true); seatWait = null; }
      if (isFull) return;
      if (switching) { switching = false; retry = 0; connect(); return; }   // 방 바꾸기
      if (hopping) { hopping = false; retry = 0; connect(); return; }
      setPill(T('reconnecting'));
      scheduleRetry();
    };
    ws.onerror = () => { try { ws && ws.close(); } catch {} };
  }
  function scheduleRetry() {
    clearTimeout(retryTimer);
    const wait = Math.min(10, 1 * 2 ** retry++) * 1000;   // 1초, 2초, 4초 … 최대 10초
    retryTimer = setTimeout(connect, wait);
  }
  // 휴대폰 화면을 껐다 켜거나 인터넷이 다시 연결되면 바로 재연결
  window.addEventListener('online', () => { if (nick && !ws && !isFull) { retry = 0; connect(); } });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && nick && !ws && !isFull) { retry = 0; connect(); }
  });

  document.getElementById('retryBtn').addEventListener('click', () => {
    isFull = false; fullModal.classList.remove('show'); retry = 0; openPicker('');
  });

  function openPicker(msg) {
    joinModal.classList.add('show'); loadRooms(msg);
    document.getElementById('joinBtn').textContent = ws ? T('moveRoom') : T('join');
  }
  function enter(name) {
    roomIdx = pickIdx; isFull = false;
    if (ws) {                                         // 들어와 있던 방을 나가고 새 방으로
      if (state === 'sit') stopAction();
      const old = ws; ws = null;
      old.onclose = old.onmessage = old.onerror = null;
      try { old.close(); } catch {}
      clearInterval(pingTimer); clearOthers();
    }
    nick = name.trim().slice(0, 16) || T('guest');
    try { localStorage.setItem('botari-nick', nick); } catch {}
    joinModal.classList.remove('show');
    nickInput.blur();   // 입력칸에서 빠져나와야 방향키로 걸을 수 있다
    if (myTag) monk.root.remove(myTag);
    myTag = makeNameTag(nick); monk.root.add(myTag);
    connect();
    setTimeout(() => window.maybeGuide && window.maybeGuide(), 400);
  }
  document.getElementById('joinForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!Sound.ctx) Sound.setOn(true);
    enter(nickInput.value);
  });
  document.getElementById('nickDice').addEventListener('click', () => { nickInput.value = randomName(); nickInput.dataset.auto = '1'; });
  nickInput.addEventListener('input', () => { nickInput.dataset.auto = ''; });
  // 입력 중에는 방향키·WASD가 캐릭터를 움직이지 않게
  nickInput.addEventListener('keydown', (e) => e.stopPropagation());

  // 함께 걷기 서버가 있을 때만 이름 입력창을 띄운다.
  // (서버의 /ws 는 일반 요청에 426 으로 답함) — 없으면 혼자 걷기로 그냥 시작
  let serverOn = false;
  document.getElementById('btnRoom').addEventListener('click', (e) => {
    e.stopPropagation();
    if (!serverOn) { toast(T('roomOnlyOnline')); return; }
    openPicker('');
  });
  if (online) {
    fetch('/ws', { method: 'GET', cache: 'no-store' })
      .then((r) => {
        if (r.status !== 426) return;
        try { nickInput.value = localStorage.getItem('botari-nick') || ''; } catch {}
        if (!nickInput.value) { nickInput.value = randomName(); nickInput.dataset.auto = '1'; }   // 이름이 없으면 자동으로 지어 줌
        serverOn = true;
        openPicker('');
        setTimeout(() => nickInput.focus(), 50);
      })
      .catch(() => {});   // 서버 없음 → 혼자 걷기
  }

  // 매 화면마다: 내 위치 보내기 + 다른 사람 움직이기
  function update(dt, myAct, myTap, myBell, myFx, myBead) {
    const t = now();
    if (ws && ws.readyState === 1 && t - lastSend >= 1 / C.room.sendPerSec) {
      const p = monk.root.position;
      const cur = { x: +p.x.toFixed(2), y: +p.y.toFixed(2), z: +p.z.toFixed(2), ry: +monk.root.rotation.y.toFixed(2), act: myAct, tap: myTap, bell: myBell, fx: myFx, bead: myBead };
      const changed = !last || cur.x !== last.x || cur.y !== last.y || cur.z !== last.z || cur.ry !== last.ry || cur.act !== last.act || cur.tap !== last.tap || cur.bell !== last.bell || cur.fx !== last.fx || cur.bead !== last.bead;
      if (changed) { ws.send(JSON.stringify({ t: 'pos', ...cur })); last = cur; lastSend = t; }
    }
    const rt = t - DELAY;
    others.forEach((o) => {
      const sn = o.snaps;
      while (sn.length > 2 && sn[1].t <= rt) sn.shift();
      let a = sn[0], b = sn[1] || sn[0];
      let k = b.t > a.t ? THREE.MathUtils.clamp((rt - a.t) / (b.t - a.t), 0, 1) : 1;
      const r = o.m.root, px = r.position.x, pz = r.position.z;
      const tx = a.x + (b.x - a.x) * k, ty = a.y + (b.y - a.y) * k, tz = a.z + (b.z - a.z) * k;
      r.position.x += (tx - r.position.x) * damp(12, dt);
      r.position.y += (ty - r.position.y) * damp(12, dt);
      r.position.z += (tz - r.position.z) * damp(12, dt);
      r.rotation.y = angleLerp(r.rotation.y, angleLerp(a.ry, b.ry, k), damp(10, dt));
      const speed = Math.hypot(r.position.x - px, r.position.z - pz) / Math.max(dt, 1e-3);
      if (b.act === 3 && o.lastAct !== 3) o.m.bowT = 0.001;          // 절하기 시작
      o.lastAct = b.act;
      if (b.act === 1) poseSit(o.m, dt);
      else if (b.act === 2) poseRest(o.m, dt);
      else poseWalk(o.m, dt, THREE.MathUtils.clamp(speed / C.character.speed, 0, 1.35));
      poseOverlay(o.m, dt);
    });
  }
  return {
    update,
    anyoneSitting: () => [...others.values()].some((o) => o.m.sitting && o.m.body.position.y < -0.25),
    forEachSitting: (fn) => others.forEach((o) => { if (o.m.sitting) fn(o.m); }),
    forEachOther: (fn) => others.forEach((o) => fn(o.m)),
    seatTaken: (id) => [...others.values()].some((o) => o.seat === id),
    // 방석 맡기: 서버가 "비었음" 하면 true (혼자 걷기·연결 끊김이면 바로 true)
    claimSeat(id) {
      if (!ws || ws.readyState !== 1) return Promise.resolve(true);
      return new Promise((res) => {
        seatWait = res; ws.send(JSON.stringify({ t: 'seat', id }));
        setTimeout(() => { if (seatWait === res) { seatWait = null; res(true); } }, 1500);
      });
    },
    releaseSeat() { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'seat', id: null })); },
    relabel() { if (ws && ws.readyState === 1) countText(); if (joinModal.classList.contains('show') && counts.length) renderRooms(); }
  };
})();

/* =====================================================================
   건물 위치 축소 도면 (오른쪽 위) — 위쪽 = 절 안쪽(대웅전), 아래쪽 = 들어오는 길
   ===================================================================== */
// 작은 도면용 짧은 이름
function shortName(name) {
  const n = AREA(name) || '';
  if (LANG === 'ko' || LANG === 'zh') return n.length > 2 ? n.slice(0, 2) : n;
  const skip = { en: [], vi: ['Đại', 'Điện', 'Cổng', 'Miếu', 'Tháp', 'Hồ'], th: [] }[LANG] || [];
  if (LANG === 'th') return n.replace(/^(วิหาร|ศาลเจ้า|ประตู)/, '');
  const w = n.split(' ').filter((x) => !skip.includes(x));
  return w[0] || n;
}

const MiniMap = (() => {
  const cv = document.getElementById('miniMap'), shade = document.getElementById('mapShade');
  const g = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = O.wall || { minX: -20, maxX: 20, minZ: -20, maxZ: 10 };
  const pad = 3, x0 = w.minX - pad, x1 = w.maxX + pad, z0 = w.minZ - pad, z1 = C.world.start.z + 3;
  let W = 112, H = 172, sc = 1, ox = 0, oz = 0, big = false, bg = null;
  const mx = (x) => ox + (x - x0) * sc, mz = (z) => oz + (z - z0) * sc;
  const clampX = (x) => Math.max(x0, Math.min(x1, x)), clampZ = (z) => Math.max(z0, Math.min(z1, z));
  const FONT = '-apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';

  // 바탕 그리기 (크기가 바뀔 때마다 다시)
  function build() {
    const r = cv.getBoundingClientRect(); W = Math.round(r.width); H = Math.round(r.height);
    cv.width = W * dpr; cv.height = H * dpr;
    sc = Math.min((W - 8) / (x1 - x0), (H - 8) / (z1 - z0));
    ox = (W - (x1 - x0) * sc) / 2; oz = (H - (z1 - z0) * sc) / 2;
    const k = Math.min(2.2, W / 112);                     // 글씨 크기 배율
    bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
    const b = bg.getContext('2d'); b.scale(dpr, dpr);
    b.fillStyle = 'rgba(111,143,90,0.55)'; b.fillRect(mx(x0), mz(z0), (x1 - x0) * sc, (z1 - z0) * sc);   // 숲
    b.fillStyle = 'rgba(120,120,112,0.9)'; b.fillRect(mx(-0.7), mz(w.maxZ), 1.4 * sc, (C.world.start.z - w.maxZ) * sc);  // 숲길
    if (O.wall) {
      b.fillStyle = 'rgba(205,189,152,0.95)'; b.fillRect(mx(w.minX), mz(w.minZ), (w.maxX - w.minX) * sc, (w.maxZ - w.minZ) * sc);   // 마당
      b.strokeStyle = '#6b665c'; b.lineWidth = 1.5 * k; b.strokeRect(mx(w.minX), mz(w.minZ), (w.maxX - w.minX) * sc, (w.maxZ - w.minZ) * sc);   // 담장
      b.fillStyle = 'rgba(205,189,152,1)'; b.fillRect(mx(-1.6), mz(w.maxZ) - 1.5 * k, 3.2 * sc, 3 * k);   // 담장 입구
    }
    b.strokeStyle = 'rgba(120,116,106,0.95)'; b.lineWidth = 1.6 * k; b.lineCap = 'round'; b.lineJoin = 'round';   // 돌길
    pathLines.forEach((pts) => { b.beginPath(); pts.forEach(([x, z], i) => (i ? b.lineTo(mx(x), mz(z)) : b.moveTo(mx(x), mz(z)))); b.stroke(); });
    b.textAlign = 'center'; b.textBaseline = 'middle'; b.font = `bold ${9 * k}px ${FONT}`;
    for (const it of mapItems) {
      const x = mx(it.minX), z = mz(it.minZ), ww = (it.maxX - it.minX) * sc, hh = (it.maxZ - it.minZ) * sc;
      b.fillStyle = it.type === 'hall' ? '#2b2f33' : it.type === 'gate' ? '#a3262a' : it.type === 'bell' ? '#2f7a6a' : it.type === 'pond' ? '#4f8fa8' : '#7d7b74';
      if (it.type === 'pond') { b.beginPath(); b.ellipse(x + ww / 2, z + hh / 2, ww / 2, hh / 2, 0, 0, Math.PI * 2); b.fill(); }
      else b.fillRect(x, z, ww, hh);
      if (it.name && it.type !== 'gate' && (big || it.type !== 'pond')) {   // 연못 이름은 크게 볼 때만
        const label = big ? AREA(it.name) : shortName(it.name);   // 크게 볼 땐 이름 전부
        b.lineWidth = 2.5 * k; b.strokeStyle = 'rgba(30,30,30,0.9)'; b.lineJoin = 'round';
        b.strokeText(label, x + ww / 2, z + hh / 2 + 0.5); b.fillStyle = '#fff'; b.fillText(label, x + ww / 2, z + hh / 2 + 0.5);
      }
    }
    b.font = `bold ${7.5 * k}px ${FONT}`; b.textAlign = 'left';
    for (const it of mapItems) if (it.type === 'gate') { b.fillStyle = '#5a2a1a'; b.fillText(big || LANG === 'ko' || LANG === 'zh' ? AREA(it.name) : '', mx(it.maxX) + 2 * k, mz((it.minZ + it.maxZ) / 2) + 0.5); }
    // 크게 보기 / 작게 보기 안내
    b.font = `bold ${(big ? 12 : 8) * (big ? 1 : 1)}px ${FONT}`; b.textAlign = 'right'; b.textBaseline = 'bottom';
    b.fillStyle = 'rgba(59,42,26,0.85)';
    b.fillText(big ? T('mapClose') : '🔍', W - 5, H - 3);
    acc = 1;   // 바로 다시 그림
  }
  function toggle(v = !big) {
    big = v; cv.classList.toggle('big', big); shade.classList.toggle('show', big);
    requestAnimationFrame(build);
  }
  cv.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); toggle(); });
  shade.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); toggle(false); });
  window.addEventListener('resize', () => requestAnimationFrame(build));
  window.addEventListener('keydown', (e) => { if (e.code === 'KeyN' && !e.repeat) toggle(); if (e.code === 'Escape' && big) toggle(false); });

  let acc = 0;
  function dot(x, z, r, fill, stroke) {
    g.beginPath(); g.arc(mx(clampX(x)), mz(clampZ(z)), r, 0, Math.PI * 2);
    g.fillStyle = fill; g.fill(); if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1; g.stroke(); }
  }
  function draw(dt) {
    acc += dt; if (acc < 0.1 || !bg) return; acc = 0;          // 1초에 10번만 다시 그림 (가볍게)
    const k = Math.min(2.2, W / 112);
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
    g.drawImage(bg, 0, 0);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    Net.forEachOther((m) => dot(m.root.position.x, m.root.position.z, 2.6 * k, '#ffffff', '#3b2a1a'));   // 다른 사람
    const p = monk.root.position, ry = monk.root.rotation.y;
    // 자동 걷기 중이면 갈 길을 점선으로
    if (autoGo) {
      const a = autoGo.ry, L = autoGo.left;
      g.setLineDash([3 * k, 3 * k]); g.strokeStyle = '#c0392b'; g.lineWidth = 1.5 * k;
      g.beginPath(); g.moveTo(mx(p.x), mz(p.z)); g.lineTo(mx(clampX(p.x + Math.sin(a) * L)), mz(clampZ(p.z + Math.cos(a) * L))); g.stroke();
      g.setLineDash([]);
    }
    // 나 (보는 방향 화살표)
    const px = mx(clampX(p.x)), pz = mz(clampZ(p.z));
    const fx = Math.sin(ry), fz = Math.cos(ry), s1 = 6 * k, s2 = 3.6 * k, s3 = 2.5 * k;
    g.beginPath();
    g.moveTo(px + fx * s1, pz + fz * s1);
    g.lineTo(px - fz * s2 - fx * s3, pz + fx * s2 - fz * s3);
    g.lineTo(px + fz * s2 - fx * s3, pz - fx * s2 - fz * s3);
    g.closePath(); g.fillStyle = '#f2b51c'; g.fill(); g.strokeStyle = '#5a3a1a'; g.lineWidth = 1; g.stroke();
  }
  build();
  return { draw, toggle, rebuild: () => requestAnimationFrame(build) };
})();

/* ---------------- 그리기 반복 ---------------- */
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  MiniMap.draw(dt);
  // 행동 번호: 0 걷기 · 1 합장 · 2 제자리 앉기 · 3 절하기
  const actCode = state === 'sit' ? 1 : resting ? 2 : monk.bowT > 0 ? 3 : 0;
  const fx = (monk.gassho ? 1 : 0) | (heldMoktak ? 2 : 0);   // 서서 합장 · 목탁 들고 있음
  Net.update(dt, actCode, tapCount, bellCount, fx, beadCount);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
/* ---------------- 🌏 언어 바꾸기 ---------------- */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-Hant' : LANG;
  document.title = '보따리 · ' + T('place');
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = T(el.dataset.i18nPh); });
  const cur = LANGS[LI()][1];
  document.getElementById('joinLang').textContent = '🌏 ' + cur;
  document.getElementById('btnLang').querySelector('span:last-child').textContent = cur;
  if (actTarget) actLabel.textContent = T(actTarget.type === 'bell' ? 'bellAct' : 'pray'); else actLabel.textContent = T('pray');
  document.getElementById('filmShot').textContent = T('filmShot');
  updateBtns(); renderPill(); Net.relabel(); MiniMap.rebuild(); Chant.show();
  if (document.getElementById('guide').classList.contains('show')) showGuide(gStep);
  if (document.getElementById('joinModal').classList.contains('show')) document.getElementById('joinBtn').textContent = T('join');
}
function setLang(l) {
  LANG = l; try { localStorage.setItem('botari-lang', l); } catch {}
  // 이름이 자동 이름 그대로면 새 언어 이름으로
  const ni = document.getElementById('nickInput'); if (ni && ni.dataset.auto === '1') { ni.value = randomName(); }
  applyLang(); renderLangs();
}
const langModal = document.getElementById('langModal');
function renderLangs() {
  document.getElementById('langList').innerHTML = LANGS.map(([k, n]) => `<button type="button" data-l="${k}" class="${k === LANG ? 'sel' : ''}">${n}</button>`).join('');
}
document.getElementById('langList').addEventListener('click', (e) => { const b = e.target.closest('button[data-l]'); if (b) { setLang(b.dataset.l); langModal.classList.remove('show'); } });
document.getElementById('langClose').addEventListener('click', () => langModal.classList.remove('show'));
langModal.addEventListener('pointerdown', (e) => e.stopPropagation());
const openLang = () => { renderLangs(); langModal.classList.add('show'); };
document.getElementById('btnLang').addEventListener('click', (e) => { e.stopPropagation(); openLang(); });
document.getElementById('joinLang').addEventListener('click', openLang);
applyLang();

window.__sceneReady = true;
// 처음 온 사람에게 안내 (이름 입력창이 떠 있으면 입장한 뒤에)
setTimeout(() => { if (!document.getElementById('joinModal').classList.contains('show')) window.maybeGuide(); }, 1200);
loop();
</script>
