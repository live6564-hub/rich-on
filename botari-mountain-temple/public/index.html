  objects: {
    roof: "#1f2226", pillar: "#a3262a",          // 검은 기와지붕, 붉은 기둥
    gates: [
      { type: "일주문", z: 36 },                  // 기둥이 한 줄로 선 첫 문
      { type: "천왕문", z: 25 },                  // 사천왕이 지키는 문
      { type: "불이문", z: 14 }                   // 담장 입구 (여기부터 절 마당)

    wall: { minX: -22, maxX: 22, minZ: -26, maxZ: 14 },   // 돌담장
    halls: [
      { name: "대웅전", x: 0,   z: -8,  face: "south", w: 10,  d: 7,   wallH: 3.4, baseH: 0.8, statue: "삼존불" },
      { name: "극락전", x: 14,  z: -6,  face: "west",  w: 7,   d: 5.5, wallH: 3.0, baseH: 0.6, statue: "아미타불" },
      { name: "관음전", x: -14, z: -6,  face: "east",  w: 7,   d: 5.5, wallH: 3.0, baseH: 0.6, statue: "관음보살" },
      { name: "산신각", x: 10,  z: -19, face: "south", w: 4.5, d: 3.5, wallH: 2.5, baseH: 0.4, statue: "산신" },
      { name: "요사채", x: 14,  z: 7,   face: "west",  w: 8,   d: 4.5, wallH: 2.6, baseH: 0.3, closed: true } // 스님 사는 집 (문 닫힘)
    ],
    bellTower: { name: "범종각", x: -13, z: 7, face: "east" },
    pagoda:    { name: "삼층석탑", x: 0, z: 5 },

  // 4) 단추 (STEP 3에서 사용)

    label: "합장",
    target: "cushion",       // 방석

  },

  // 배경음: 잔잔한 바람 + 이따금 풍경 소리

  world: { size: 100, start: { x: 0, z: 46 }, ground: "#6f8f5a", court: "#cdbd98", skyTop: "#7fb2e0", skyBottom: "#e7eef2", fog: "#dfe8ea" }

<script type="module">
import * as THREE from 'three';

const C = window.CONFIG;

/* ---------------- 장소 이름 알약 ---------------- */
document.getElementById('placePill').textContent = C.placeName;
document.title = '보따리 · ' + C.placeName;

/* ---------------- 3D 기본 ---------------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(C.world.fog, 30, 140);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 4.5, 12);
camera.lookAt(0, 1, 0);

/* ---------------- 하늘 (공 모양 안쪽에 위→아래 색 번짐) ---------------- */
const skyGeo = new THREE.SphereGeometry(150, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    top:    { value: new THREE.Color(C.world.skyTop) },
    bottom: { value: new THREE.Color(C.world.skyBottom) }
  },
  vertexShader: `varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 bottom; varying vec3 vPos;
    void main(){ float h = clamp(normalize(vPos).y * 1.6 + 0.15, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, h), 1.0); }`
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

/* ---------------- 빛 ---------------- */
scene.add(new THREE.HemisphereLight(0xdfefff, 0x5a6b48, 0.9));
const sun = new THREE.DirectionalLight(0xfff3dd, 1.4);
sun.position.set(12, 20, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const S = C.world.size / 2;
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 70 });
scene.add(sun); scene.add(sun.target);   // 그림자 범위는 캐릭터를 따라다닌다 (넓은 절에서도 선명하게)

/* ---------------- 땅 (납작한 상자) ---------------- */
const ground = new THREE.Mesh(
  new THREE.BoxGeometry(C.world.size, 1, C.world.size),
  new THREE.MeshStandardMaterial({ color: C.world.ground, roughness: 1 })
);
ground.position.y = -0.5;
ground.receiveShadow = true;
scene.add(ground);

// 땅 바깥의 먼 들판 (보이기만 하고 걸어갈 수는 없음)
const farLand = new THREE.Mesh(
  new THREE.BoxGeometry(320, 1, 320),
  new THREE.MeshStandardMaterial({ color: 0x5d7a4c, roughness: 1 })
);
farLand.position.y = -0.52;
scene.add(farLand);

// 멀리 보이는 산 (원뿔) — 배경 분위기용, 땅 바깥에 둔다
const mountainMat = new THREE.MeshStandardMaterial({ color: 0x5f7a6a, roughness: 1, flatShading: true });
[[-40, -80, 14, 22], [-8, -95, 18, 26], [30, -85, 15, 22], [60, -70, 12, 20], [-65, -60, 11, 18]]
  .forEach(([x, z, h, r]) => {
    const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), mountainMat);
    m.position.set(x, h / 2 - 1, z);
    scene.add(m);
  });

/* =====================================================================
   STEP 3 — 큰절 꾸미기 (CONFIG.objects 대로) : 상자·원기둥·원뿔·공만 사용
   ===================================================================== */
const O = C.objects;
const colliders = { circles: [], boxes: [] };   // 통과 못 하는 것들
const camBlockers = [];                          // 카메라가 뚫고 지나가면 안 되는 것들
const walkables = [];                            // 올라설 수 있는 곳 (기단·계단·마루)
const targets = [];                              // 행동 단추 대상 (방석·종)
const areas = [];                                // 알약에 보일 구역 이름
const moktaks = [];                              // 법당마다 있는 목탁
const indoors = [];                              // 법당 안 (카메라를 낮고 가깝게)
const mapItems = [];                             // 축소 도면에 그릴 것들
const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...extra });
function part(geo, material, x, y, z, parent = scene) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
const FACE = { south: 0, north: Math.PI, east: Math.PI / 2, west: -Math.PI / 2 };

// 건물 하나의 "제자리 좌표" (건물 앞 = +z). 충돌·높이도 이 좌표로 적고 세계 좌표로 바꾼다.
function makeFrame(cx, cz, yaw) {
  const g = new THREE.Group(); g.position.set(cx, 0, cz); g.rotation.y = yaw; scene.add(g);
  const c = Math.cos(yaw), sn = Math.sin(yaw);
  const toW = (lx, lz) => [cx + lx * c + lz * sn, cz - lx * sn + lz * c];
  const aabb = (minX, maxX, minZ, maxZ) => {
    const ps = [toW(minX, minZ), toW(maxX, minZ), toW(minX, maxZ), toW(maxX, maxZ)];
    return { minX: Math.min(...ps.map((q) => q[0])), maxX: Math.max(...ps.map((q) => q[0])),
             minZ: Math.min(...ps.map((q) => q[1])), maxZ: Math.max(...ps.map((q) => q[1])) };
  };
  return {
    g, cx, cz, yaw, toW,
    box(minX, maxX, minZ, maxZ) { colliders.boxes.push(aabb(minX, maxX, minZ, maxZ)); },
    map(minX, maxX, minZ, maxZ, type, name) { mapItems.push({ ...aabb(minX, maxX, minZ, maxZ), type, name }); },
    circle(lx, lz, r) { const [x, z] = toW(lx, lz); colliders.circles.push({ x, z, r }); },
    walk(minX, maxX, minZ, maxZ, h, stairs) { walkables.push({ cx, cz, yaw, minX, maxX, minZ, maxZ, h, stairs }); },
    area(minX, maxX, minZ, maxZ, name) { areas.push({ cx, cz, yaw, minX, maxX, minZ, maxZ, name }); }
  };
}
function toLocal(w, x, z) {
  const dx = x - w.cx, dz = z - w.cz, c = Math.cos(w.yaw), sn = Math.sin(w.yaw);
  return [dx * c - dz * sn, dx * sn + dz * c];
}

const stone = mat(0x9a9890), stoneDark = mat(0x7d7b74), wood = mat(0x8a5a32), floorWood = mat(0xb48a5a);
const red = mat(O.pillar), roof = mat(O.roof, { roughness: 0.7 }), green = mat(0x2f7a6a);
const wallMat = mat(0xefe6d2), doorMat = mat(0x9a6a3a);
const gold = mat(0xd4a640, { metalness: 0.6, roughness: 0.35 });
const haloMat = mat(0xe8c766, { metalness: 0.4, roughness: 0.4 });
const skinMat = mat(0xe8c39a);

// 현판 (글자를 그린 캔버스를 얇은 상자 앞면에 붙임)
function makeSign(text, w, h) {
  const cv = document.createElement('canvas'); cv.width = 64 * text.length + 64; cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = '#1d3a35'; g.fillRect(0, 0, cv.width, cv.height);
  g.strokeStyle = '#c9a646'; g.lineWidth = 8; g.strokeRect(6, 6, cv.width - 12, cv.height - 12);
  g.fillStyle = '#f1d27a'; g.font = 'bold 72px "Apple SD Gothic Neo", "Malgun Gothic", serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, cv.width / 2, 68);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const dark = mat(0x1d3a35);
  const front = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 });
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.08), [dark, dark, dark, dark, front, dark]);
}

// 검은 기와지붕 (처마 + 사각뿔 + 용마루 + 들린 처마 끝)
function addRoof(F, W, D, y, ox = 1.2, oz = 1.0, rise = 1.8) {
  const eave = part(new THREE.BoxGeometry(W + ox * 2, 0.24, D + oz * 2), roof, 0, y, 0, F.g);
  camBlockers.push(eave);
  const roofGeo = new THREE.ConeGeometry(1, 1, 4); roofGeo.rotateY(Math.PI / 4);
  const r = part(roofGeo, roof, 0, y + 0.12 + rise / 2, 0, F.g);
  r.scale.set((W / 2 + ox - 0.1) / 0.7071, rise, (D / 2 + oz) / 0.7071);
  part(new THREE.BoxGeometry(W * 0.55, 0.22, 0.3), roof, 0, y + rise * 1.03, 0, F.g);
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
    const cn = part(new THREE.ConeGeometry(0.12, 0.6, 6), roof, sx * (W / 2 + ox - 0.05), y + 0.25, sz * (D / 2 + oz + 0.05), F.g);
    cn.rotation.set(sz * 0.5, 0, -sx * 0.5);
  });
}

// 불상 (공·원기둥) — kind: 'buddha' 부처님 / 'bodhi' 보살 (보관을 씀)
function addBuddha(parent, x, y0, z, s, kind = 'buddha', robeMat = gold, faceMat = gold) {
  const b = new THREE.Group(); b.position.set(x, y0, z); b.scale.setScalar(s); parent.add(b);
  part(new THREE.CylinderGeometry(0.75, 0.8, 0.25, 20), gold, 0, 0.12, 0, b);       // 연꽃 대좌
  part(new THREE.CylinderGeometry(0.62, 0.7, 0.35, 20), robeMat, 0, 0.4, 0, b);      // 앉은 다리
  part(new THREE.CylinderGeometry(0.32, 0.5, 0.75, 20), robeMat, 0, 0.92, 0, b);     // 몸
  part(new THREE.SphereGeometry(0.11, 12, 10), faceMat, -0.08, 0.75, 0.42, b);       // 모은 손
  part(new THREE.SphereGeometry(0.11, 12, 10), faceMat, 0.08, 0.75, 0.42, b);
  part(new THREE.SphereGeometry(0.3, 20, 16), faceMat, 0, 1.56, 0, b);               // 머리
  if (kind === 'buddha') part(new THREE.SphereGeometry(0.13, 12, 10), faceMat, 0, 1.86, 0, b);   // 육계
  else {
    part(new THREE.CylinderGeometry(0.27, 0.32, 0.22, 16), gold, 0, 1.86, 0, b);    // 보관
    part(new THREE.ConeGeometry(0.1, 0.2, 8), gold, 0, 2.06, 0, b);
  }
  const halo = part(new THREE.CylinderGeometry(0.9, 0.9, 0.05, 32), haloMat, 0, 1.4, -0.45, b);
  halo.rotation.x = Math.PI / 2;                                                    // 광배
  return b;
}
// 법당 안 상 (CONFIG의 statue 이름대로)
function addStatue(F, kind, y0, z) {
  const g = F.g;
  if (kind === '삼존불') {                       // 가운데 부처님 + 양옆 보살
    part(new THREE.BoxGeometry(5.4, 0.5, 1.3), wood, 0, y0 + 0.25, z, g);
    addBuddha(g, 0, y0 + 0.5, z, 1.15);
    addBuddha(g, -1.8, y0 + 0.5, z + 0.05, 0.8, 'bodhi');
    addBuddha(g, 1.8, y0 + 0.5, z + 0.05, 0.8, 'bodhi');
    [-0.8, 0.8].forEach((dx) => {
      part(new THREE.CylinderGeometry(0.05, 0.05, 0.3, 10), mat(0xfaf5e8), dx, y0 + 0.65, z + 0.55, g);
      part(new THREE.SphereGeometry(0.04, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffd27a }), dx, y0 + 0.84, z + 0.55, g);
    });
    F.box(-2.8, 2.8, z - 0.75, z + 0.75);
  } else if (kind === '아미타불' || kind === '관음보살') {
    part(new THREE.BoxGeometry(1.7, 0.5, 1.2), wood, 0, y0 + 0.25, z, g);
    if (kind === '아미타불') addBuddha(g, 0, y0 + 0.5, z, 1.0);
    else {
      const white = mat(0xf4f1e8), face = mat(0xead09a, { metalness: 0.3, roughness: 0.5 });
      addBuddha(g, 0, y0 + 0.5, z, 1.0, 'bodhi', white, face);
      part(new THREE.CylinderGeometry(0.06, 0.08, 0.22, 10), mat(0x9ec9c0), 0.32, y0 + 1.35, z + 0.38, g);   // 정병
      part(new THREE.SphereGeometry(0.06, 8, 8), mat(0x9ec9c0), 0.32, y0 + 1.5, z + 0.38, g);
    }
    [-0.62, 0.62].forEach((dx) => {
      part(new THREE.CylinderGeometry(0.05, 0.05, 0.3, 10), mat(0xfaf5e8), dx, y0 + 0.65, z + 0.45, g);
      part(new THREE.SphereGeometry(0.04, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffd27a }), dx, y0 + 0.84, z + 0.45, g);
    });
    F.circle(0, z, 1.0);
  } else if (kind === '산신') {                  // 흰 수염 산신령 + 호랑이
    part(new THREE.BoxGeometry(1.0, 0.45, 0.7), wood, -0.4, y0 + 0.22, z, g);
    const robeB = mat(0x9fb8c8), white = mat(0xf5f5f2);
    part(new THREE.CylinderGeometry(0.28, 0.42, 0.8, 16), robeB, -0.4, y0 + 0.85, z, g);
    part(new THREE.SphereGeometry(0.24, 16, 12), skinMat, -0.4, y0 + 1.45, z, g);
    const beard = part(new THREE.ConeGeometry(0.16, 0.45, 12), white, -0.4, y0 + 1.15, z + 0.17, g);
    beard.rotation.x = Math.PI;
    part(new THREE.CylinderGeometry(0.2, 0.22, 0.18, 14), mat(0x2a2a2a), -0.4, y0 + 1.7, z, g);   // 관
    // 호랑이 (엎드림)
    const tiger = mat(0xe0802a), black = mat(0x222222);
    part(new THREE.BoxGeometry(0.95, 0.4, 0.42), tiger, 0.75, y0 + 0.22, z + 0.1, g);
    part(new THREE.BoxGeometry(0.38, 0.34, 0.36), tiger, 0.75, y0 + 0.4, z + 0.45, g).rotation.y = 0.1;
    [-0.3, -0.05, 0.2].forEach((dx) => part(new THREE.BoxGeometry(0.06, 0.41, 0.44), black, 0.75 + dx, y0 + 0.22, z + 0.1, g));
    [-0.11, 0.11].forEach((dx) => part(new THREE.ConeGeometry(0.06, 0.12, 6), tiger, 0.75 + dx, y0 + 0.62, z + 0.42, g));
    const tail = part(new THREE.CylinderGeometry(0.04, 0.04, 0.6, 8), tiger, 1.3, y0 + 0.3, z - 0.1, g);
    tail.rotation.z = 1.1;
    F.box(-1.0, 1.45, z - 0.5, z + 0.7);
  }
}

// 방석 + 목탁
function addCushion(F, lx, lz, y0, faceYaw, name) {
  const g = F.g;
  part(new THREE.CylinderGeometry(0.42, 0.45, 0.12, 24), mat(0x8e2a35), lx, y0 + 0.06, lz, g);
  part(new THREE.CylinderGeometry(0.3, 0.3, 0.125, 24), mat(0xc79a3c), lx, y0 + 0.065, lz, g).castShadow = false;
  const mk = new THREE.Group(); mk.position.set(lx + 0.75, y0, lz + 0.3); g.add(mk);
  const body = part(new THREE.SphereGeometry(0.16, 20, 16), mat(0x8b3a1e, { roughness: 0.5 }), 0, 0.13, 0, mk);
  body.scale.set(1, 0.8, 1.1);
  part(new THREE.BoxGeometry(0.2, 0.02, 0.03), mat(0x2a1208), 0, 0.15, 0.16, mk);
  const stick = new THREE.Group(); stick.position.set(0.05, 0.42, 0.05); mk.add(stick);
  part(new THREE.CylinderGeometry(0.015, 0.015, 0.3, 8), wood, 0, 0, 0, stick).rotation.z = Math.PI / 2.4;
  part(new THREE.SphereGeometry(0.035, 10, 8), wood, -0.13, -0.05, 0, stick);
  const [mx, mz] = F.toW(lx + 0.75, lz + 0.3);
  const moktak = { g: mk, stick, x: mx, z: mz, hit: 0 };
  moktaks.push(moktak);
  const [x, z] = F.toW(lx, lz);
  targets.push({ type: 'cushion', x, z, face: faceYaw, moktak, name, label: C.action.label, icon: '🙏', radius: C.action.radius });
}

// 법당 (앞면이 열림) / 요사채 (closed: 앞면에 문이 닫혀 있음)
function buildHall(o) {
  const yaw = FACE[o.face] ?? 0, F = makeFrame(o.x, o.z, yaw);
  const W = o.w, D = o.d, H = o.wallH, bh = o.baseH, t = 0.3;
  const steps = Math.max(2, Math.round(bh / 0.2)), depth = 0.45, hw = Math.min(1.6, W / 4);
  const bMinX = -W / 2 - 1, bMaxX = W / 2 + 1, bMinZ = -D / 2 - 1, bMaxZ = D / 2 + 1.5;
  const floorH = bh + 0.08;
  // 돌 기단 + 가장자리 (계단 말고는 못 올라감)
  part(new THREE.BoxGeometry(bMaxX - bMinX, bh, bMaxZ - bMinZ), stone, 0, bh / 2, (bMinZ + bMaxZ) / 2, F.g);
  const e = 0.1;
  F.box(bMinX, -hw, bMaxZ - e, bMaxZ + e); F.box(hw, bMaxX, bMaxZ - e, bMaxZ + e);
  F.box(bMinX - e, bMinX + e, bMinZ, bMaxZ); F.box(bMaxX - e, bMaxX + e, bMinZ, bMaxZ);
  F.box(bMinX, bMaxX, bMinZ - e, bMinZ + e);
  F.walk(bMinX, bMaxX, bMinZ, bMaxZ, bh);
  // 돌계단
  for (let i = 0; i < steps; i++) {
    const h = (bh / steps) * (i + 1), zf = bMaxZ + depth * (steps - i);
    part(new THREE.BoxGeometry(hw * 2, h, depth), i % 2 ? stone : stoneDark, 0, h / 2, zf - depth / 2, F.g);
  }
  F.walk(-hw, hw, bMaxZ, bMaxZ + depth * steps, bh, { z0: bMaxZ, n: steps, depth });
  // 마루
  part(new THREE.BoxGeometry(W, 0.08, D), floorWood, 0, bh + 0.04, 0, F.g);
  F.walk(-W / 2, W / 2, -D / 2, D / 2, floorH);
  indoors.push({ cx: F.cx, cz: F.cz, yaw: F.yaw, minX: -W / 2, maxX: W / 2, minZ: -D / 2 - 0.6, maxZ: D / 2 + 0.6 });
  // 벽 (뒤·왼쪽·오른쪽)
  const back = part(new THREE.BoxGeometry(W + t, H, t), wallMat, 0, bh + H / 2, -D / 2, F.g);
  const left = part(new THREE.BoxGeometry(t, H, D), wallMat, -W / 2, bh + H / 2, 0, F.g);
  const right = part(new THREE.BoxGeometry(t, H, D), wallMat, W / 2, bh + H / 2, 0, F.g);
  camBlockers.push(back, left, right);
  F.box(-W / 2 - t / 2, W / 2 + t / 2, -D / 2 - t / 2, -D / 2 + t / 2);
  F.box(-W / 2 - t / 2, -W / 2 + t / 2, -D / 2, D / 2);
  F.box(W / 2 - t / 2, W / 2 + t / 2, -D / 2, D / 2);
  // 붉은 기둥 (앞 4개 + 뒤 모서리 2개)
  const pillarGeo = new THREE.CylinderGeometry(0.18, 0.2, H, 14);
  const inner = W / 6;
  [-W / 2, -inner, inner, W / 2].forEach((x) => { part(pillarGeo, red, x, bh + H / 2, D / 2, F.g); F.circle(x, D / 2, 0.22); });
  [-W / 2, W / 2].forEach((x) => part(pillarGeo, red, x, bh + H / 2, -D / 2, F.g));
  // 요사채: 앞면에 문짝 (못 들어감)
  if (o.closed) {
    const front = part(new THREE.BoxGeometry(W, H - 0.5, 0.15), doorMat, 0, bh + (H - 0.5) / 2, D / 2 - 0.05, F.g);
    camBlockers.push(front);
    for (let x = -W / 2 + W / 8; x < W / 2; x += W / 4)
      part(new THREE.BoxGeometry(0.06, H - 0.6, 0.18), mat(0x6b4a2a), x, bh + (H - 0.5) / 2, D / 2 - 0.02, F.g);
    F.box(-W / 2, W / 2, D / 2 - 0.15, D / 2 + 0.1);
    // 툇마루 (기단 위 앞쪽)
  }
  // 단청 띠 (카메라가 뚫지 않게)
  camBlockers.push(part(new THREE.BoxGeometry(W + 0.4, 0.3, 0.25), green, 0, bh + H - 0.15, D / 2, F.g));
  camBlockers.push(part(new THREE.BoxGeometry(W + 0.4, 0.12, 0.27), red, 0, bh + H - 0.36, D / 2, F.g));
  addRoof(F, W, D, bh + H + 0.12, 1.2, 1.0, Math.min(1.8, W * 0.2 + 0.4));
  // 현판
  const sign = makeSign(o.name, Math.min(1.9, W * 0.3), 0.55);
  sign.position.set(0, bh + H - 0.62, D / 2 + 0.2); F.g.add(sign); camBlockers.push(sign);
  // 상 + 방석 + 불빛
  if (o.statue) {
    const sz = -D / 2 + 1.0;
    addStatue(F, o.statue, floorH, sz);
    const cz = Math.min(D / 2 - 0.9, sz + 1.9);
    addCushion(F, 0, cz, floorH, yaw + Math.PI, o.name);
    const lt = new THREE.PointLight(0xffc98a, 6, Math.max(W, D) + 2, 1.6);
    const [lx, lz] = F.toW(0, 0); lt.position.set(lx, bh + H * 0.75, lz); scene.add(lt);
  }
  F.area(bMinX, bMaxX, bMinZ, bMaxZ + depth * steps, o.name);
  F.map(-W / 2, W / 2, -D / 2, D / 2, 'hall', o.name);
}

// 일주문 · 천왕문 · 불이문
function buildGate(gate) {
  const F = makeFrame(0, gate.z, 0);
  if (gate.type === '일주문') {
    [-1.9, 1.9].forEach((x) => {
      part(new THREE.CylinderGeometry(0.3, 0.34, 4.0, 16), red, x, 2.0, 0, F.g);
      part(new THREE.CylinderGeometry(0.45, 0.5, 0.35, 16), stone, x, 0.17, 0, F.g);
      F.circle(x, 0, 0.5);
    });
    part(new THREE.BoxGeometry(4.6, 0.35, 0.35), green, 0, 3.75, 0, F.g);
    part(new THREE.BoxGeometry(4.6, 0.14, 0.37), red, 0, 3.5, 0, F.g);
    addRoof(F, 4.4, 1.0, 4.08, 0.9, 0.8, 1.0);
    const sign = makeSign(C.placeName.replace(/\s/g, ''), 1.6, 0.5); sign.position.set(0, 3.15, 0.25); F.g.add(sign);
    F.area(-3, 3, -1.5, 1.5, '일주문');
    F.map(-2.4, 2.4, -0.5, 0.5, 'gate', '일주문');
  } else if (gate.type === '천왕문') {
    const W = 8, D = 4.6, H = 3.2, t = 0.3, pw = 1.4;
    part(new THREE.BoxGeometry(W, 0.08, D), floorWood, 0, 0.04, 0, F.g);
    // 바깥 옆벽 + 앞·뒤 벽 (가운데 통로만 열림)
    const walls = [
      [t, H, D, -W / 2, 0], [t, H, D, W / 2, 0],
      [W / 2 - pw, H, t, -(pw + W / 2) / 2, D / 2], [W / 2 - pw, H, t, (pw + W / 2) / 2, D / 2],
      [W / 2 - pw, H, t, -(pw + W / 2) / 2, -D / 2], [W / 2 - pw, H, t, (pw + W / 2) / 2, -D / 2]
    ];
    walls.forEach(([w, h, d, x, z]) => {
      const m = part(new THREE.BoxGeometry(w, h, d), wallMat, x, h / 2, z, F.g); camBlockers.push(m);
      F.box(x - w / 2, x + w / 2, z - d / 2, z + d / 2);
    });
    // 사천왕 4분 (통로 양옆 난간 너머)
    const kings = [[0x2f6fb0, 'sword'], [0xc0392b, 'pagoda'], [0x2e8b57, 'pipa'], [0xd4a017, 'rope']];
    [[-2.7, 1.0], [-2.7, -1.0], [2.7, 1.0], [2.7, -1.0]].forEach(([x, z], i) => addKing(F.g, x, z, x < 0 ? Math.PI / 2 : -Math.PI / 2, ...kings[i]));
    // 나무 난간 (통로와 사천왕 사이)
    [-pw, pw].forEach((x) => {
      part(new THREE.BoxGeometry(0.1, 0.9, D - 0.4), red, x, 0.45, 0, F.g);
      F.box(x - 0.08, x + 0.08, -D / 2, D / 2);
    });
    [[-pw, D / 2], [pw, D / 2], [-pw, -D / 2], [pw, -D / 2]].forEach(([x, z]) => { part(new THREE.CylinderGeometry(0.17, 0.19, H, 12), red, x, H / 2, z, F.g); F.circle(x, z, 0.2); });
    part(new THREE.BoxGeometry(W + 0.4, 0.28, 0.25), green, 0, H - 0.14, D / 2, F.g);
    addRoof(F, W, D, H + 0.12, 1.1, 0.9, 1.6);
    const sign = makeSign('천왕문', 1.5, 0.48); sign.position.set(0, H - 0.55, D / 2 + 0.2); F.g.add(sign);
    const lt = new THREE.PointLight(0xffe0b0, 3, 7, 1.6); lt.position.set(0, 2.6, gate.z); scene.add(lt);
    F.area(-W / 2, W / 2, -D / 2 - 0.5, D / 2 + 0.5, '천왕문');
    F.map(-W / 2, W / 2, -D / 2, D / 2, 'gate', '천왕문');
  } else if (gate.type === '불이문') {
    const H = 3.0;
    [[-1.6, 0.7], [1.6, 0.7], [-1.6, -0.7], [1.6, -0.7]].forEach(([x, z]) => {
      part(new THREE.CylinderGeometry(0.2, 0.22, H, 14), red, x, H / 2, z, F.g); F.circle(x, z, 0.24);
    });
    part(new THREE.BoxGeometry(3.6, 0.3, 0.25), green, 0, H - 0.15, 0.7, F.g);
    addRoof(F, 3.4, 1.4, H + 0.12, 0.9, 0.8, 1.1);
    const sign = makeSign('불이문', 1.3, 0.44); sign.position.set(0, H - 0.55, 0.9); F.g.add(sign);
    F.area(-2.5, 2.5, -1.5, 1.5, '불이문');
    F.map(-2.2, 2.2, -0.9, 0.9, 'gate', '불이문');
  }
}

// 사천왕 (서 있는 큰 장수)
function addKing(g, x, z, yaw, color, item) {
  const k = new THREE.Group(); k.position.set(x, 0.08, z); k.rotation.y = yaw; g.add(k);
  const robeM = mat(color), armor = mat(0xc9a646, { metalness: 0.5, roughness: 0.4 }), dark = mat(0x222222);
  part(new THREE.CylinderGeometry(0.42, 0.55, 1.3, 14), robeM, 0, 0.65, 0, k);
  part(new THREE.BoxGeometry(0.75, 0.6, 0.45), armor, 0, 1.55, 0, k);
  part(new THREE.SphereGeometry(0.28, 16, 12), mat(0xc98a5e), 0, 2.12, 0, k);
  [-0.1, 0.1].forEach((dx) => part(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffffff }), dx, 2.17, 0.24, k));
  [-0.1, 0.1].forEach((dx) => part(new THREE.SphereGeometry(0.03, 8, 8), dark, dx, 2.17, 0.29, k));
  [-1, 1].forEach((sx) => { const b = part(new THREE.BoxGeometry(0.16, 0.04, 0.04), dark, sx * 0.1, 2.27, 0.25, k); b.rotation.z = sx * 0.35; });
  part(new THREE.CylinderGeometry(0.22, 0.3, 0.25, 12), armor, 0, 2.42, 0, k);                    // 투구
  [-1, 1].forEach((sx) => part(new THREE.CylinderGeometry(0.1, 0.12, 0.6, 10), robeM, sx * 0.48, 1.55, 0.12, k).rotation.x = -0.6);
  if (item === 'sword') part(new THREE.BoxGeometry(0.06, 1.1, 0.12), mat(0xdddddd, { metalness: 0.8, roughness: 0.2 }), 0.48, 1.9, 0.35, k);
  if (item === 'pagoda') { [0.2, 0.15, 0.1].forEach((w, i) => part(new THREE.BoxGeometry(w, 0.1, w), armor, -0.48, 1.95 + i * 0.12, 0.35, k)); }
  if (item === 'pipa') { part(new THREE.SphereGeometry(0.2, 12, 10), wood, 0, 1.35, 0.4, k).scale.set(1, 1.3, 0.4); part(new THREE.BoxGeometry(0.05, 0.6, 0.05), wood, 0, 1.8, 0.4, k); }
  if (item === 'rope') { const r = part(new THREE.CylinderGeometry(0.04, 0.04, 1.0, 8), mat(0xc0392b), 0.48, 1.5, 0.35, k); r.rotation.z = 0.5; }
}

// 돌담장 (불이문 자리만 열림)
function buildWall(w) {
  const H = 1.4, T = 0.5, gate = 1.9;
  const seg = (minX, maxX, minZ, maxZ) => {
    const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2, sx = maxX - minX, sz = maxZ - minZ;
    const m = part(new THREE.BoxGeometry(sx, H, sz), mat(0xb7ae9c), cx, H / 2, cz);
    part(new THREE.BoxGeometry(sx + 0.3, 0.25, sz + 0.3), roof, cx, H + 0.12, cz);
    camBlockers.push(m);
    colliders.boxes.push({ minX, maxX, minZ, maxZ });
  };
  seg(w.minX, -gate, w.maxZ - T / 2, w.maxZ + T / 2);
  seg(gate, w.maxX, w.maxZ - T / 2, w.maxZ + T / 2);
  seg(w.minX - T / 2, w.minX + T / 2, w.minZ, w.maxZ);
  seg(w.maxX - T / 2, w.maxX + T / 2, w.minZ, w.maxZ);
  seg(w.minX, w.maxX, w.minZ - T / 2, w.minZ + T / 2);
  // 마당 (모래색 흙)
  const court = part(new THREE.BoxGeometry(w.maxX - w.minX - T, 0.02, w.maxZ - w.minZ - T), mat(C.world.court, { roughness: 1 }), (w.minX + w.maxX) / 2, 0.01, (w.minZ + w.maxZ) / 2);
  court.castShadow = false;
}

// 둘레 소나무 (한 번에 그리기: InstancedMesh [인스턴스드 메시] = 같은 모양을 여러 개 빠르게 그리는 방법)
if (O.pines) {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const lim = C.world.size / 2 - 2, w = O.wall;
  const spots = [];
  for (let tries = 0; spots.length < O.pines && tries < 5000; tries++) {
    const x = (rnd() * 2 - 1) * lim, z = (rnd() * 2 - 1) * lim;
    if (w && x > w.minX - 2.5 && x < w.maxX + 2.5 && z > w.minZ - 2.5 && z < w.maxZ + 2.5) continue;   // 담장 안·가까이 비움
    if (Math.abs(x) < 6 && z > (w ? w.maxZ : 0) - 1) continue;                                      // 숲길 비움
    if (Math.abs(x) < 6.5 && O.gates.some((gt) => Math.abs(z - gt.z) < 4)) continue;                // 문 둘레 비움
    if (spots.some((q) => Math.hypot(q.x - x, q.z - z) < 2.6)) continue;
    spots.push({ x, z, s: 0.8 + rnd() * 0.7, r: rnd() * 6, lean: (rnd() - 0.5) * 0.15 });
  }
  const parts3 = [
    [new THREE.CylinderGeometry(0.14, 0.22, 2.2, 8), mat(0x6b4a30), 1.1],
    [new THREE.ConeGeometry(1.3, 1.4, 8), mat(0x2e5b3a), 1.9],
    [new THREE.ConeGeometry(1.0, 1.2, 8), mat(0x3c6e44), 2.6],
    [new THREE.ConeGeometry(0.65, 1.0, 8), mat(0x2e5b3a), 3.25]
  ];
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e3 = new THREE.Euler(), v = new THREE.Vector3(), sc = new THREE.Vector3();
  parts3.forEach(([geo, material, y], k) => {
    const inst = new THREE.InstancedMesh(geo, material, spots.length);
    spots.forEach((p, i) => {
      e3.set(0, p.r, k === 0 ? p.lean : 0); q.setFromEuler(e3);
      m4.compose(v.set(p.x, y * p.s, p.z), q, sc.setScalar(p.s));
      inst.setMatrixAt(i, m4);
    });
    inst.castShadow = true; inst.receiveShadow = true; scene.add(inst);
  });
  // 소나무는 통과 못 함: 줄기만이 아니라 아래쪽 솔잎 둘레까지 막는다
  spots.forEach((p) => colliders.circles.push({ x: p.x, z: p.z, r: 1.05 * p.s }));
}

function groundHeight(x, z) {
  let h = 0;
  for (const w of walkables) {
    const [lx, lz] = toLocal(w, x, z);
    if (lx < w.minX || lx > w.maxX || lz < w.minZ || lz > w.maxZ) continue;   // 경계도 포함 (계단과 기단 사이 틈 없음)
    let hh = w.h;
    if (w.stairs) {
      const i = Math.min(w.stairs.n - 1, Math.floor((lz - w.stairs.z0) / w.stairs.depth));   // 0 = 맨 위 칸
      hh = (w.h / w.stairs.n) * (w.stairs.n - i);
    }
    if (hh > h) h = hh;
  }
  return h;
}
// 지금 있는 구역 이름 (알약에 표시)
function areaAt(x, z) {
  for (const a of areas) {
    const [lx, lz] = toLocal(a, x, z);
    if (lx > a.minX && lx < a.maxX && lz > a.minZ && lz < a.maxZ) return a.name;
  }
  return '';
}
function isIndoor(x, z) {
  return indoors.some((a) => { const [lx, lz] = toLocal(a, x, z); return lx > a.minX && lx < a.maxX && lz > a.minZ && lz < a.maxZ; });
}
const BODY_R = 0.3;
function blocked(x, z) {
  for (const c of colliders.circles) if (Math.hypot(c.x - x, c.z - z) < c.r + BODY_R) return true;
  for (const b of colliders.boxes)
    if (x > b.minX - BODY_R && x < b.maxX + BODY_R && z > b.minZ - BODY_R && z < b.maxZ + BODY_R) return true;
  return false;
}

/* =====================================================================
   소리 — Web Audio 합성 (파일 없음). 화면을 처음 누른 뒤부터 소리를 낸다.
   ===================================================================== */
const Sound = {
  ctx: null, master: null, on: false, chimeTimer: null,

  init() {
    if (this.ctx) return;
    const ctx = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(ctx.destination);

    // 바람: 흰 소음 → 낮은 대역 필터 → 천천히 출렁이는 볼륨
    const len = ctx.sampleRate * 3;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = buf; noise.loop = true;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 0.7;

    const windGain = ctx.createGain();
    windGain.gain.value = C.ambience.wind;

    // 느린 출렁임 (LFO [엘에프오] = 아주 느린 떨림)
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.08;
    const lfoAmt = ctx.createGain(); lfoAmt.gain.value = C.ambience.wind * 0.6;
    lfo.connect(lfoAmt).connect(windGain.gain);
    const lfo2 = ctx.createOscillator(); lfo2.frequency.value = 0.05;
    const lfo2Amt = ctx.createGain(); lfo2Amt.gain.value = 180;
    lfo2.connect(lfo2Amt).connect(lp.frequency);

    noise.connect(lp).connect(windGain).connect(this.master);
    noise.start(); lfo.start(); lfo2.start();
  },

  // 풍경 소리: 맑은 금속음 몇 개가 짧게 겹쳐 딸랑
  chime() {
    if (!this.ctx || !this.on) return;
    const ctx = this.ctx, now = ctx.currentTime;
    const base = [1318, 1568, 1760, 2093][Math.floor(Math.random() * 4)];
    const hits = 2 + Math.floor(Math.random() * 3);
    for (let h = 0; h < hits; h++) {
      const t = now + h * (0.12 + Math.random() * 0.18);
      [1, 2.76, 5.4].forEach((ratio, k) => {
        const o = ctx.createOscillator(); o.type = 'sine';
        o.frequency.value = base * ratio * (1 + (Math.random() - 0.5) * 0.01);
        const g = ctx.createGain();
        const peak = [0.07, 0.025, 0.01][k];
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2 - k * 0.6);
        o.connect(g).connect(this.master);
        o.start(t); o.stop(t + 2.4);
      });
    }
  },

  // 목탁: 나무를 두드리는 "똑" (짧은 소음 + 맑은 울림)
  tok() {
    if (!this.ctx || !this.on) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(620, t); o.frequency.exponentialRampToValueAtTime(480, t + 0.12);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + 0.25);
    const n = ctx.createBufferSource();
    const len = Math.floor(ctx.sampleRate * 0.03), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    n.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 1.5;
    const ng = ctx.createGain(); ng.gain.value = 0.35;
    n.connect(bp).connect(ng).connect(this.master); n.start(t);
  },

  // 범종: 낮고 길게 "웅~" + 맥놀이(두 소리가 겹쳐 울렁이는 한국 종소리)
  bell() {
    if (!this.ctx || !this.on) return;
    const ctx = this.ctx, t = ctx.currentTime, base = 82;
    [[1, 0.32, 9], [1.012, 0.26, 9], [2.0, 0.12, 6], [2.76, 0.07, 4], [4.1, 0.035, 2.5]].forEach(([r, peak, dur]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = base * r;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.master); o.start(t); o.stop(t + dur + 0.1);
    });
    const n = ctx.createBufferSource(), len = Math.floor(ctx.sampleRate * 0.15);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    n.buffer = buf;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
    const ng = ctx.createGain(); ng.gain.value = 0.5;
    n.connect(lp).connect(ng).connect(this.master); n.start(t);
  },

  scheduleChime() {
    clearTimeout(this.chimeTimer);
    const [a, b] = C.ambience.chimeEverySec;
    this.chimeTimer = setTimeout(() => { this.chime(); this.scheduleChime(); }, (a + Math.random() * (b - a)) * 1000);
  },

  setOn(v) {
    this.init();
    this.on = v;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setTargetAtTime(v ? 1 : 0, t, 0.4);
    if (v) { this.scheduleChime(); setTimeout(() => this.chime(), 1200); }
    else clearTimeout(this.chimeTimer);
    soundBtn.textContent = v ? '🔊' : '🔇';
    hint.style.opacity = 0;
  }
};

   STEP 2 — 캐릭터 (회색 승복 동자승) : 상자·원기둥·원뿔·공만 사용

function makeMonk(cfg) {
  const root = new THREE.Group();      // 위치·방향
  const body = new THREE.Group();      // 걸을 때 통통 튀는 부분
  root.add(body);
  const robe = new THREE.MeshStandardMaterial({ color: cfg.robe, roughness: 0.9 });
  const robeDark = new THREE.MeshStandardMaterial({ color: new THREE.Color(cfg.robe).multiplyScalar(0.75), roughness: 0.9 });
  const skin = new THREE.MeshStandardMaterial({ color: cfg.skin, roughness: 0.7 });
  const black = new THREE.MeshStandardMaterial({ color: 0x222222 });
  const shoe = new THREE.MeshStandardMaterial({ color: 0xe8e2d4, roughness: 0.9 });
  const add = (parent, geo, mat, x, y, z) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; parent.add(m); return m;
  };

  // 다리 (원기둥) + 신발 (상자)
  const legs = [];
  [-0.11, 0.11].forEach((x) => {
    const hip = new THREE.Group(); hip.position.set(x, 0.42, 0); body.add(hip);
    add(hip, new THREE.CylinderGeometry(0.075, 0.075, 0.36, 10), robeDark, 0, -0.18, 0);
    add(hip, new THREE.BoxGeometry(0.14, 0.07, 0.22), shoe, 0, -0.38, 0.03);
    legs.push(hip);
  });

  // 윗몸 (허리 위) — 절할 때 허리에서 굽혀진다
  const upper = new THREE.Group(); upper.position.y = 0.45; body.add(upper);
  // 승복 몸통 (원뿔을 잘라 쓴 원기둥: 위가 좁고 아래가 넓은 치마 모양)
  add(upper, new THREE.CylinderGeometry(0.2, 0.32, 0.55, 16), robe, 0, 0.21, 0);
  // 앞섶 (상자)
  add(upper, new THREE.BoxGeometry(0.06, 0.4, 0.02), robeDark, 0.05, 0.27, 0.24).rotation.z = 0.35;

  // 팔 (원기둥) + 손 (공)
  const arms = [];
  [-1, 1].forEach((side) => {
    const sh = new THREE.Group(); sh.position.set(side * 0.24, 0.43, 0); upper.add(sh);
    add(sh, new THREE.CylinderGeometry(0.065, 0.085, 0.34, 10), robe, 0, -0.16, 0);
    add(sh, new THREE.SphereGeometry(0.06, 12, 10), skin, 0, -0.35, 0);
    sh.rotation.z = side * 0.12;
    arms.push(sh);
  });

  // 머리 (공, 민머리) + 눈 (작은 공) + 귀 (공)
  const head = new THREE.Group(); head.position.set(0, 0.7, 0); upper.add(head);
  add(head, new THREE.SphereGeometry(0.24, 24, 18), skin, 0, 0, 0);
  add(head, new THREE.SphereGeometry(0.03, 8, 8), black, -0.08, 0.02, 0.215);
  add(head, new THREE.SphereGeometry(0.03, 8, 8), black, 0.08, 0.02, 0.215);
  add(head, new THREE.SphereGeometry(0.05, 10, 8), skin, -0.24, 0, 0);
  add(head, new THREE.SphereGeometry(0.05, 10, 8), skin, 0.24, 0, 0);
  // 볼 (살짝 붉은 공)
  const cheek = new THREE.MeshStandardMaterial({ color: 0xf2a7a0, transparent: true, opacity: 0.6 });
  add(head, new THREE.SphereGeometry(0.035, 8, 8), cheek, -0.14, -0.06, 0.19);
  add(head, new THREE.SphereGeometry(0.035, 8, 8), cheek, 0.14, -0.06, 0.19);

  // 손에 드는 작은 목탁 (T 키로 두드릴 때만 보임)
  const handMoktak = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 10), new THREE.MeshStandardMaterial({ color: 0x8b3a1e, roughness: 0.5 }));
  handMoktak.scale.set(1, 0.8, 1.1); handMoktak.position.set(0, -0.42, 0.04); handMoktak.visible = false; handMoktak.castShadow = true;
  arms[0].add(handMoktak);

  return { root, body, upper, legs, arms, head, handMoktak, phase: 0, moveAmt: 0, sitting: false, bowT: 0, tapT: 0, tapShow: 0 };
}

// 걷는 몸짓 (amt = 0 멈춤 ~ 1 걷기). 앉은 자세에서도 부드럽게 풀린다.
function poseWalk(m, dt, amt) {
  m.moveAmt += (amt - m.moveAmt) * damp(8, dt);
  m.phase += dt * 9 * m.moveAmt;
  const sw = Math.sin(m.phase) * 0.6 * m.moveAmt, k = damp(8, dt);
  m.legs[0].rotation.x += (sw - m.legs[0].rotation.x) * k;
  m.legs[1].rotation.x += (-sw - m.legs[1].rotation.x) * k;
  m.arms.forEach((a, i) => {
    const side = i ? 1 : -1;
    a.rotation.x += ((i ? sw : -sw) * 0.8 - a.rotation.x) * k;
    a.rotation.z += (side * 0.12 - a.rotation.z) * k;
  });
  m.body.position.y += (Math.abs(Math.sin(m.phase)) * 0.05 * m.moveAmt - m.body.position.y) * k;
  m.head.rotation.x += (0 - m.head.rotation.x) * k;
  m.sitting = false;
}
// 앉아서 두 손 모으기
function poseSit(m, dt) {
  const k = damp(6, dt);
  m.body.position.y += (-0.32 - m.body.position.y) * k;
  m.legs.forEach((l) => { l.rotation.x += (-1.45 - l.rotation.x) * k; });
  m.arms.forEach((a, i) => {
    const side = i ? 1 : -1;
    a.rotation.x += (-1.3 - a.rotation.x) * k;
    a.rotation.z += (-side * 0.62 - a.rotation.z) * k;
  });
  m.moveAmt = 0;
  m.sitting = true;
}

// 제자리 앉기 (두 손은 무릎 위)
function poseRest(m, dt) {
  const k = damp(6, dt);
  m.body.position.y += (-0.32 - m.body.position.y) * k;
  m.legs.forEach((l) => { l.rotation.x += (-1.45 - l.rotation.x) * k; });
  m.arms.forEach((a, i) => {
    const side = i ? 1 : -1;
    a.rotation.x += (-0.55 - a.rotation.x) * k;
    a.rotation.z += (side * 0.18 - a.rotation.z) * k;
  });
  m.head.rotation.x += (0 - m.head.rotation.x) * k;
  m.moveAmt = 0;
  m.sitting = false;
}
// 절하기·목탁 두드리기는 지금 자세 위에 덧입힌다 (내 캐릭터·다른 사람 공통)
function poseOverlay(m, dt) {
  // 절하기: 두 손을 모으고 허리를 천천히 굽혔다 편다 (1.6초)
  if (m.bowT > 0) {
    m.bowT += dt / 1.6;
    const bend = Math.sin(Math.PI * Math.min(m.bowT, 1));
    m.upper.rotation.x = 0.8 * bend;
    m.head.rotation.x = 0.25 * bend;
    m.arms.forEach((a, i) => {
      const side = i ? 1 : -1;
      a.rotation.x = THREE.MathUtils.lerp(a.rotation.x, -1.3, Math.min(1, bend * 1.6));
      a.rotation.z = THREE.MathUtils.lerp(a.rotation.z, -side * 0.62, Math.min(1, bend * 1.6));
    });
    if (m.bowT >= 1) m.bowT = 0;
  } else {
    m.upper.rotation.x += (0 - m.upper.rotation.x) * damp(8, dt);
  }
  // 목탁 두드리기: 왼손에 작은 목탁을 들고, 오른손으로 똑
  if (m.tapShow > 0) {
    m.tapShow -= dt;
    m.handMoktak.visible = true;
    m.arms[0].rotation.x = -1.05; m.arms[0].rotation.z = 0.35;
    if (m.tapT > 0) {
      m.tapT = Math.max(0, m.tapT - dt * 5);
      m.arms[1].rotation.x = -0.6 - 0.55 * Math.sin(Math.PI * m.tapT);
      m.arms[1].rotation.z = -0.45;
    } else { m.arms[1].rotation.x = -0.6; m.arms[1].rotation.z = -0.45; }
  } else m.handMoktak.visible = false;
}
function startTap(m) { m.tapT = 1; m.tapShow = 1.6; }

const monk = makeMonk(C.character);

function joyMove(e) {
  const r = joyEl.getBoundingClientRect();
  const max = r.width / 2 - 14;
  let dx = e.clientX - (r.left + r.width / 2);
  let dy = e.clientY - (r.top + r.height / 2);
  const len = Math.hypot(dx, dy);
  if (len > max) { dx *= max / len; dy *= max / len; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  joy.x = dx / max; joy.y = dy / max;
}
function joyEnd(e) {
  if (e.pointerId !== joy.id) return;
  joy.id = null; joy.x = joy.y = 0;
  knob.style.transform = '';
}

  e.preventDefault();
  joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e);

/* ---------------- 걷기 + 행동(합장) ---------------- */

const tmpLook = new THREE.Vector3();
const ACT = C.action;

const actBtn = document.getElementById('actBtn');
const actLabel = document.getElementById('actLabel'), actIco = actBtn.querySelector('.ico');
actLabel.textContent = ACT.label;

function ringBell() {

}
function startAction() {

  sitTarget = actTarget;

}

}

window.addEventListener('keydown', (e) => {

// 제자리 앉기 ↔ 서기
function toggleRest() {

}

}
// 목탁 두드리기

}

/* ---------------- 휴대폰 동작 단추 (조이스틱과 같은 조건에서 보임) ---------------- */
const moveBtns = document.getElementById('moveBtns');
const btnRun = document.getElementById('btnRun'), btnRest = document.getElementById('btnRest');
let runOn = false;
const setTouchClass = (v) => document.body.classList.toggle('touch', v);
setTouchClass(isTouch);
window.matchMedia('(pointer: coarse)').addEventListener?.('change', (e) => setTouchClass(e.matches));
const onBtn = (el, fn) => el.addEventListener('pointerdown', (e) => {
  e.preventDefault(); e.stopPropagation();

onBtn(btnRun, () => { runOn = !runOn; btnRun.classList.toggle('on', runOn); });
onBtn(btnRest, toggleRest);

function update(dt) {
  // 1) 입력 모으기 (앞 = +1, 오른쪽 = +1)
  let f = (keys.f ? 1 : 0) - (keys.b ? 1 : 0);
  let s = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
  if (joy.id !== null) { f = -joy.y; s = joy.x; }
  let mag = Math.min(1, Math.hypot(f, s));
  if (mag < 0.12) mag = 0;

  // 다시 움직이면 일어나서 걷기로
  if (state === 'sit' && mag > 0 && sitT > 0.6) stopAction();
  if (resting && mag > 0) { resting = false; camYaw = monk.root.rotation.y; }
  if (monk.bowT > 0 && mag > 0) monk.bowT = 0;

  const p = monk.root.position;

  if (state === 'walk') {
    // 2) 카메라가 보는 방향 기준으로 움직임 + 충돌 (막히면 그 방향만 멈춰서 벽을 따라 미끄러짐)
    if (mag > 0 && !resting) {
      const len = Math.hypot(f, s);
      const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
      const rx = -Math.cos(camYaw), rz = Math.sin(camYaw);
      const dx = (fx * f + rx * s) / len, dz = (fz * f + rz * s) / len;
      const run = (keys.run || runOn) ? C.character.run : 1;     // Shift 또는 🏃 단추: 빨리 걷기
      const step = C.character.speed * run * mag * dt;
      const nx = THREE.MathUtils.clamp(p.x + dx * step, -LIMIT, LIMIT);
      if (!blocked(nx, p.z)) p.x = nx;
      const nz = THREE.MathUtils.clamp(p.z + dz * step, -LIMIT, LIMIT);
      if (!blocked(p.x, nz)) p.z = nz;
      monk.root.rotation.y = angleLerp(monk.root.rotation.y, Math.atan2(dx, dz), damp(10, dt));
    }
    p.y += (groundHeight(p.x, p.z) - p.y) * damp(14, dt);   // 계단을 부드럽게 오르내림

    // 3) 걷는 몸짓 + 앉은 자세에서 천천히 풀기
    if (resting) poseRest(monk, dt);
    else poseWalk(monk, dt, mag * ((keys.run || runOn) && mag > 0 ? 1.35 : 1));

    // 행동 단추: 가장 가까운 방석·종 반경 안에서만 보임
    let best = null, bestD = 1e9;
    for (const t of targets) {
      const d = Math.hypot(p.x - t.x, p.z - t.z);
      if (d <= t.radius && d < bestD) { best = t; bestD = d; }
    }
    if (best !== actTarget) {
      actTarget = best;
      if (best) { actLabel.textContent = best.label; actIco.textContent = best.icon; }
    }
    actBtn.classList.toggle('show', !!best);
  } else {
    // 4) 합장: 방석으로 가서 불상을 향해 앉고, 두 손을 모은다
    sitT = Math.min(1, sitT + dt / 0.9);
    const e = sitT * sitT * (3 - 2 * sitT);
    p.x = THREE.MathUtils.lerp(sitFrom.x, sitTarget.x, e);
    p.z = THREE.MathUtils.lerp(sitFrom.z, sitTarget.z, e);
    p.y += (groundHeight(p.x, p.z) + 0.1 - p.y) * damp(10, dt);
    monk.root.rotation.y = angleLerp(monk.root.rotation.y, sitTarget.face, damp(6, dt));   // 상 쪽을 봄
    poseSit(monk, dt);
  }
  poseOverlay(monk, dt);
  if (btnRest.classList.contains('on') !== resting) {
    btnRest.classList.toggle('on', resting);
    btnRest.querySelector('.lbl').textContent = resting ? '서기' : '앉기';
  }

  // 목탁: 누군가(나 또는 다른 사람) 합장 중이면 박자에 맞춰 똑똑
  const meSitting = state === 'sit' && sitT >= 1;
  if (meSitting || Net.anyoneSitting()) {
    beatT += dt;
    const period = 60 / ACT.bpm;
    if (beatT >= period) {
      beatT -= period; Sound.tok();
      if (meSitting) sitTarget.moktak.hit = 1;
      Net.forEachSitting((m) => {          // 다른 사람이 앉은 곳 가장 가까운 목탁
        let best = null, bd = 1e9;
        moktaks.forEach((k) => { const d = Math.hypot(k.x - m.root.position.x, k.z - m.root.position.z); if (d < bd) { bd = d; best = k; } });
        if (best && bd < 3) best.hit = 1;
      });
    }
    // 박자마다 고개를 살짝 숙임
    const nod = 0.12 * Math.exp(-beatT * 5);
    if (meSitting) monk.head.rotation.x = nod;
    Net.forEachSitting((m) => { m.head.rotation.x = nod; });
  } else beatT = 0;

  // 목탁 채 움직임 (때리고 → 천천히 올라감)
  for (const m of moktaks) {
    m.hit = Math.max(0, m.hit - dt * 6);
    m.stick.rotation.z = -0.5 * (1 - m.hit) + 0.25;
    m.stick.position.y = 0.42 - 0.18 * m.hit;
    m.g.scale.setScalar(1 + 0.05 * m.hit);
  }
  // 당목: 종을 치고 천천히 흔들리다 멈춤
  if (bellLog) {
    bellSwing = Math.max(0, bellSwing - dt * 0.6);
    const sw = bellSwing > 0.85 ? -(1 - bellSwing) / 0.15 * 0.5 : -0.5 * Math.sin((1 - bellSwing) * 9) * bellSwing;
    bellLog.position.x = 1.55 + sw;
  }
  // 알약: 지금 있는 곳 이름
  const an = areaAt(p.x, p.z);
  if (an !== areaNow) { areaNow = an; renderPill(); }
  // 해 그림자가 캐릭터를 따라옴
  sun.position.set(p.x + 12, 20, p.z + 8); sun.target.position.set(p.x, 0, p.z);

  // 5) 카메라 — 캐릭터 둘레를 원을 그리며 돈다 (몸을 뚫고 지나가지 않음)
  const gy = p.y;
  let wantYaw, wantDist, wantH, wantLookH, lag;
  if (state === 'walk' && !resting) {
    if (mag > 0 && f > -0.3) camYaw = angleLerp(camYaw, monk.root.rotation.y, damp(CAM.yawLag * mag, dt));
    wantYaw = camYaw; wantDist = CAM.dist; wantH = CAM.height; wantLookH = CAM.lookH; lag = CAM.posLag;
    if (isIndoor(p.x, p.z)) { wantDist = 3.6; wantH = 1.7; wantLookH = 1.1; }   // 법당 안: 현판·들보에 안 가리게 낮고 가깝게
  } else {
    // 행동 중: 얼굴 쪽(비스듬한 앞)으로 천천히 돈다
    wantYaw = monk.root.rotation.y + Math.PI + 0.85; wantDist = 2.8; wantH = 1.5; wantLookH = 0.55; lag = 0.9;
  }
  orbit.yaw = angleLerp(orbit.yaw, wantYaw, damp(lag, dt));
  orbit.dist += (wantDist - orbit.dist) * damp(lag, dt);
  orbit.h += (wantH - orbit.h) * damp(lag, dt);
  orbit.lookH += (wantLookH - orbit.lookH) * damp(lag, dt);
  tmpLook.set(p.x, gy + orbit.lookH, p.z);
  tmpTarget.set(p.x - Math.sin(orbit.yaw) * orbit.dist, gy + orbit.h, p.z - Math.cos(orbit.yaw) * orbit.dist);
  // 벽·지붕을 뚫지 않게 카메라를 앞으로 당김
  const dir = tmpTarget.clone().sub(tmpLook), dist = dir.length();
  camRay.set(tmpLook, dir.normalize()); camRay.far = dist;
  const hit = camRay.intersectObjects(camBlockers, false)[0];
  if (hit) tmpTarget.copy(tmpLook).addScaledVector(dir, Math.max(0.6, hit.distance - 0.3));

  camera.position.lerp(tmpTarget, damp(4, dt));
  camLook.lerp(tmpLook, damp(CAM.lookLag, dt));

}
window.__debug = { get state() { return state; }, startAction, groundHeight, blocked, camera, scene, renderer };

/* =====================================================================
   STEP 5 — 함께 걷기 (Cloudflare Workers + Durable Objects, WebSocket)
   - 내 위치는 움직일 때만, 1초에 최대 5번까지만 보낸다
   - 다른 사람 캐릭터는 받은 위치 사이를 부드럽게 이어서 움직인다
   - 연결이 끊기면 스스로 다시 연결한다
   ===================================================================== */
// 머리 위 이름표 (글자를 그린 캔버스 → 3D 판)
function makeNameTag(text) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
  const g = cv.getContext('2d');
  g.font = 'bold 30px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  const w = Math.min(244, g.measureText(text).width + 32);
  g.fillStyle = 'rgba(255,250,240,0.92)';
  g.beginPath(); g.roundRect((256 - w) / 2, 8, w, 48, 24); g.fill();
  g.fillStyle = '#3b2a1a'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 128, 33, 230);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  sp.scale.set(1.2, 0.3, 1); sp.position.y = 1.72; sp.renderOrder = 10;
  return sp;
}

let pillNet = '';
function renderPill() {
  const parts = [C.placeName];
  if (areaNow) parts.push(areaNow);
  if (pillNet) parts.push(pillNet);
  document.getElementById('placePill').textContent = parts.join(' · ');
}

const Net = (() => {
  const pill = document.getElementById('placePill');
  const joinModal = document.getElementById('joinModal');
  const fullModal = document.getElementById('fullModal');
  const nickInput = document.getElementById('nickInput');
  const online = location.protocol === 'http:' || location.protocol === 'https:';
  const others = new Map();        // id → { m, tag, snaps: [{t,x,y,z,ry,act}] }
  const DELAY = 0.25;              // 0.25초 늦게 그려서 받은 위치 사이를 부드럽게 잇는다
  let ws = null, myId = null, nick = '', retry = 0, retryTimer = null, pingTimer = null;
  let isFull = false, lastSend = 0, last = null, myTag = null;

  const now = () => performance.now() / 1000;
  const setPill = (extra) => { pillNet = extra || ''; renderPill(); };

  function addOther(info) {
    if (info.id === myId || others.has(info.id)) return;
    const m = makeMonk(C.character);
    const tag = makeNameTag(info.name || '손님');
    m.root.add(tag);
    m.root.position.set(info.x ?? C.world.start.x, info.y ?? 0, info.z ?? C.world.start.z);
    m.root.rotation.y = info.ry ?? Math.PI;
    scene.add(m.root);
    others.set(info.id, { m, tag, act: info.act || 0, tap: info.tap, bell: info.bell, snaps: [{ t: now(), ...info }] });
  }
  function removeOther(id) {
    const o = others.get(id); if (!o) return;
    scene.remove(o.m.root);
    o.m.root.traverse((n) => { n.geometry?.dispose?.(); n.material?.map?.dispose?.(); });
    others.delete(id);
  }
  function clearOthers() { [...others.keys()].forEach(removeOther); }
  function countText() { setPill('👥 ' + (others.size + 1) + '명'); }

  function connect() {
    clearTimeout(retryTimer);
    const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host +
      '/ws?room=' + encodeURIComponent(C.room.name) + '&name=' + encodeURIComponent(nick);
    try { ws = new WebSocket(url); } catch (e) { scheduleRetry(); return; }
    setPill('연결 중…');
    ws.onopen = () => {
      retry = 0;
      clearInterval(pingTimer);
      pingTimer = setInterval(() => { if (ws && ws.readyState === 1) ws.send('ping'); }, 25000);
      last = null;   // 연결되면 내 위치를 한 번 보낸다
    };
    ws.onmessage = (ev) => {
      if (ev.data === 'pong') return;
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.t === 'welcome') {
        myId = msg.id; clearOthers();
        msg.peers.forEach(addOther); countText();
      } else if (msg.t === 'join') { addOther(msg); countText(); }
      else if (msg.t === 'leave') { removeOther(msg.id); countText(); }
      else if (msg.t === 'pos') {
        const o = others.get(msg.id);
        if (!o) { addOther(msg); countText(); return; }
        o.snaps.push({ t: now(), x: msg.x, y: msg.y, z: msg.z, ry: msg.ry, act: msg.act });
        // 목탁 두드리기 (가까이 있을 때만 소리)
        if (o.tap !== undefined && msg.tap !== o.tap) {
          startTap(o.m);
          if (o.m.root.position.distanceTo(monk.root.position) < 10) Sound.tok();
        }
        o.tap = msg.tap;
        // 다른 사람이 종을 침 (절 어디서나 들림)
        if (o.bell !== undefined && msg.bell !== o.bell) { bellSwing = 1; Sound.bell(); }
        o.bell = msg.bell;
        if (o.snaps.length > 30) o.snaps.shift();
      } else if (msg.t === 'full') {
        isFull = true; fullModal.classList.add('show'); setPill('방이 꽉 찼어요');
      }
    };
    ws.onclose = () => {
      clearInterval(pingTimer);
      ws = null; clearOthers();
      if (isFull) return;
      setPill('다시 연결 중…');
      scheduleRetry();
    };
    ws.onerror = () => { try { ws && ws.close(); } catch {} };
  }
  function scheduleRetry() {
    clearTimeout(retryTimer);
    const wait = Math.min(10, 1 * 2 ** retry++) * 1000;   // 1초, 2초, 4초 … 최대 10초
    retryTimer = setTimeout(connect, wait);
  }
  // 휴대폰 화면을 껐다 켜거나 인터넷이 다시 연결되면 바로 재연결
  window.addEventListener('online', () => { if (nick && !ws && !isFull) { retry = 0; connect(); } });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && nick && !ws && !isFull) { retry = 0; connect(); }
  });

  document.getElementById('retryBtn').addEventListener('click', () => {
    isFull = false; fullModal.classList.remove('show'); retry = 0; connect();
  });

  function enter(name) {
    nick = name.trim().slice(0, 10) || '손님';
    try { localStorage.setItem('botari-nick', nick); } catch {}
    joinModal.classList.remove('show');
    nickInput.blur();   // 입력칸에서 빠져나와야 방향키로 걸을 수 있다
    if (myTag) monk.root.remove(myTag);
    myTag = makeNameTag(nick); monk.root.add(myTag);
    connect();
  }
  document.getElementById('joinForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!Sound.ctx) Sound.setOn(true);
    enter(nickInput.value);
  });
  // 입력 중에는 방향키·WASD가 캐릭터를 움직이지 않게
  nickInput.addEventListener('keydown', (e) => e.stopPropagation());

  if (online) {
    try { nickInput.value = localStorage.getItem('botari-nick') || ''; } catch {}
    joinModal.classList.add('show');
    setTimeout(() => nickInput.focus(), 50);
  }

  // 매 화면마다: 내 위치 보내기 + 다른 사람 움직이기
  function update(dt, myAct, myTap, myBell) {
    const t = now();
    if (ws && ws.readyState === 1 && t - lastSend >= 1 / C.room.sendPerSec) {
      const p = monk.root.position;
      const cur = { x: +p.x.toFixed(2), y: +p.y.toFixed(2), z: +p.z.toFixed(2), ry: +monk.root.rotation.y.toFixed(2), act: myAct, tap: myTap, bell: myBell };
      const changed = !last || cur.x !== last.x || cur.y !== last.y || cur.z !== last.z || cur.ry !== last.ry || cur.act !== last.act || cur.tap !== last.tap || cur.bell !== last.bell;
      if (changed) { ws.send(JSON.stringify({ t: 'pos', ...cur })); last = cur; lastSend = t; }
    }
    const rt = t - DELAY;
    others.forEach((o) => {
      const sn = o.snaps;
      while (sn.length > 2 && sn[1].t <= rt) sn.shift();
      let a = sn[0], b = sn[1] || sn[0];
      let k = b.t > a.t ? THREE.MathUtils.clamp((rt - a.t) / (b.t - a.t), 0, 1) : 1;
      const r = o.m.root, px = r.position.x, pz = r.position.z;
      const tx = a.x + (b.x - a.x) * k, ty = a.y + (b.y - a.y) * k, tz = a.z + (b.z - a.z) * k;
      r.position.x += (tx - r.position.x) * damp(12, dt);
      r.position.y += (ty - r.position.y) * damp(12, dt);
      r.position.z += (tz - r.position.z) * damp(12, dt);
      r.rotation.y = angleLerp(r.rotation.y, angleLerp(a.ry, b.ry, k), damp(10, dt));
      const speed = Math.hypot(r.position.x - px, r.position.z - pz) / Math.max(dt, 1e-3);
      if (b.act === 3 && o.lastAct !== 3) o.m.bowT = 0.001;          // 절하기 시작
      o.lastAct = b.act;
      if (b.act === 1) poseSit(o.m, dt);
      else if (b.act === 2) poseRest(o.m, dt);
      else poseWalk(o.m, dt, THREE.MathUtils.clamp(speed / C.character.speed, 0, 1.35));
      poseOverlay(o.m, dt);
    });
  }
  return {
    update,
    anyoneSitting: () => [...others.values()].some((o) => o.m.sitting && o.m.body.position.y < -0.25),
    forEachSitting: (fn) => others.forEach((o) => { if (o.m.sitting) fn(o.m); }),
    forEachOther: (fn) => others.forEach((o) => fn(o.m))
  };
})();

/* =====================================================================
   건물 위치 축소 도면 (오른쪽 위) — 위쪽 = 절 안쪽(대웅전), 아래쪽 = 들어오는 길
   ===================================================================== */
const MiniMap = (() => {
  const cv = document.getElementById('miniMap');
  const W = 112, H = 172, dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d');
  // 보여 줄 범위: 담장 둘레 + 일주문 앞 시작 자리까지
  const w = O.wall || { minX: -20, maxX: 20, minZ: -20, maxZ: 10 };
  const pad = 3, x0 = w.minX - pad, x1 = w.maxX + pad, z0 = w.minZ - pad, z1 = C.world.start.z + 3;
  const sc = Math.min((W - 8) / (x1 - x0), (H - 8) / (z1 - z0));
  const ox = (W - (x1 - x0) * sc) / 2, oz = (H - (z1 - z0) * sc) / 2;
  const mx = (x) => ox + (x - x0) * sc, mz = (z) => oz + (z - z0) * sc;
  const clampX = (x) => Math.max(x0, Math.min(x1, x)), clampZ = (z) => Math.max(z0, Math.min(z1, z));

  // 바탕 (한 번만 그림)
  const bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
  const b = bg.getContext('2d'); b.scale(dpr, dpr);
  b.fillStyle = 'rgba(111,143,90,0.55)'; b.fillRect(mx(x0), mz(z0), (x1 - x0) * sc, (z1 - z0) * sc);   // 숲
  b.fillStyle = 'rgba(120,120,112,0.9)'; b.fillRect(mx(-0.7), mz(w.maxZ), 1.4 * sc, (C.world.start.z - w.maxZ) * sc);  // 숲길
  if (O.wall) {
    b.fillStyle = 'rgba(205,189,152,0.95)'; b.fillRect(mx(w.minX), mz(w.minZ), (w.maxX - w.minX) * sc, (w.maxZ - w.minZ) * sc);   // 마당
    b.strokeStyle = '#6b665c'; b.lineWidth = 1.5; b.strokeRect(mx(w.minX), mz(w.minZ), (w.maxX - w.minX) * sc, (w.maxZ - w.minZ) * sc);   // 담장
    b.fillStyle = 'rgba(205,189,152,1)'; b.fillRect(mx(-1.6), mz(w.maxZ) - 1.5, 3.2 * sc, 3);   // 담장 입구
  }
  b.textAlign = 'center'; b.textBaseline = 'middle';
  b.font = 'bold 9px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  for (const it of mapItems) {
    const x = mx(it.minX), z = mz(it.minZ), ww = (it.maxX - it.minX) * sc, hh = (it.maxZ - it.minZ) * sc;
    b.fillStyle = it.type === 'hall' ? '#2b2f33' : it.type === 'gate' ? '#a3262a' : it.type === 'bell' ? '#2f7a6a' : '#7d7b74';
    b.fillRect(x, z, ww, hh);
    if (it.name) {
      const short = it.name.length > 2 ? it.name.slice(0, 2) : it.name;     // 대웅전 → 대웅
      const tx = x + ww / 2, tz = z + hh / 2;
      const label = it.type === 'gate' ? null : short;
      if (label) {   // 진한 테두리 글씨 (작은 건물 밖으로 나와도 잘 보이게)
        b.lineWidth = 2.5; b.strokeStyle = 'rgba(30,30,30,0.9)'; b.lineJoin = 'round';
        b.strokeText(label, tx, tz + 0.5); b.fillStyle = '#fff'; b.fillText(label, tx, tz + 0.5);
      }
    }
  }
  // 문 이름은 옆에 작게
  b.font = 'bold 7.5px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif'; b.textAlign = 'left';
  for (const it of mapItems) if (it.type === 'gate') {
    b.fillStyle = '#5a2a1a'; b.fillText(it.name, mx(it.maxX) + 2, mz((it.minZ + it.maxZ) / 2) + 0.5);
  }

  let acc = 0;
  function dot(x, z, r, fill, stroke) {
    g.beginPath(); g.arc(mx(clampX(x)), mz(clampZ(z)), r, 0, Math.PI * 2);
    g.fillStyle = fill; g.fill(); if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1; g.stroke(); }
  }
  function draw(dt) {
    acc += dt; if (acc < 0.1) return; acc = 0;          // 1초에 10번만 다시 그림 (가볍게)
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
    g.drawImage(bg, 0, 0);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    Net.forEachOther((m) => dot(m.root.position.x, m.root.position.z, 2.6, '#ffffff', '#3b2a1a'));   // 다른 사람
    // 나 (보는 방향 화살표)
    const p = monk.root.position, ry = monk.root.rotation.y;
    const px = mx(clampX(p.x)), pz = mz(clampZ(p.z));
    const fx = Math.sin(ry), fz = Math.cos(ry);
    g.beginPath();
    g.moveTo(px + fx * 6, pz + fz * 6);
    g.lineTo(px - fz * 3.6 - fx * 2.5, pz + fx * 3.6 - fz * 2.5);
    g.lineTo(px + fz * 3.6 - fx * 2.5, pz - fx * 3.6 - fz * 2.5);
    g.closePath(); g.fillStyle = '#f2b51c'; g.fill(); g.strokeStyle = '#5a3a1a'; g.lineWidth = 1; g.stroke();
  }
  return { draw };
})();

/* ---------------- 그리기 반복 ---------------- */
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  MiniMap.draw(dt);
  // 행동 번호: 0 걷기 · 1 합장 · 2 제자리 앉기 · 3 절하기
  const actCode = state === 'sit' ? 1 : resting ? 2 : monk.bowT > 0 ? 3 : 0;
  Net.update(dt, actCode, tapCount, bellCount);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
window.__sceneReady = true;
loop();
</script>
</body>
